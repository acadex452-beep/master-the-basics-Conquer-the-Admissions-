<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a1a2f">
<title>ACADEX English Grammar Hub</title>
<style>
:root{--navy:#0a1a2f;--navy2:#12304f;--card:#0f2640;--line:#2a4766;--gold:#d4af37;--gold2:#f0d98a;--text:#eef2f7;--dim:#9fb0c3;--ok:#22c55e;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;background:radial-gradient(circle at 50% -10%,#1b4a78,var(--navy) 55%);color:var(--text);line-height:1.7}
.wrap{max-width:680px;margin:auto;padding:14px 16px 40px}
header{text-align:center;padding:12px 0 6px}
.home{display:inline-block;color:var(--gold2);font-size:13px;text-decoration:none;margin-bottom:10px;padding:7px 15px;border-radius:99px;border:1px solid rgba(212,175,55,.4);background:linear-gradient(160deg,#16395c,#0c2238);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.brand{font:700 13px Georgia,serif;letter-spacing:.3em;color:var(--gold)}
h1{margin:4px 0 2px;font:700 28px/1.2 Georgia,"Times New Roman",serif;color:#fff}
.sub{margin:0;color:var(--dim);font-size:13px}
.rule-gold{height:2px;width:90px;margin:12px auto 4px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none}
.chip{flex:none;padding:9px 15px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:13px}
.chip.on{background:var(--gold);border-color:var(--gold);color:#241a00;font-weight:700}
.chip:disabled{opacity:.45}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{padding:12px;background:none;border:0;border-bottom:3px solid transparent;color:var(--dim);font:inherit;font-weight:700;font-size:15px}
.tabs button.on{color:var(--gold2);border-bottom-color:var(--gold)}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
/* lessons */
.lc{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.lc summary{cursor:pointer;padding:14px 16px;font:700 17px Georgia,serif;list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lc summary::-webkit-details-marker{display:none}
.lc summary small{font:500 14px "Noto Sans Bengali",system-ui,sans-serif;color:var(--gold2)}
.lc[open] summary{border-bottom:1px solid var(--line);background:#12304f}
.lc .in{padding:12px 16px 16px}
.lc p{margin:0 0 10px}
.tricky{margin-top:14px;padding:12px 14px;border:1px dashed var(--gold);border-radius:10px;background:#0a1a2f;font-size:14px}.tricky ul{margin:8px 0 0}
.lc .bq{border-top:1px solid var(--line);padding:8px 0}.lc .bq summary{display:block;padding:0;border:0;background:none;font:500 14px "Noto Sans Bengali",system-ui,sans-serif}.lc .bq summary small{color:var(--gold2)}.lc .bq p{margin:6px 0 0;font-size:14px}
.hl{margin:14px 2px 10px;font-size:12px;color:var(--gold2);letter-spacing:.04em;display:flex;align-items:center;gap:10px}.hl:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(212,175,55,.5),transparent)}
.pills{display:flex;flex-wrap:nowrap;gap:10px;overflow-x:auto;padding:6px 26px 14px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;-webkit-mask-image:linear-gradient(90deg,#000 90%,transparent);mask-image:linear-gradient(90deg,#000 90%,transparent)}.pills::-webkit-scrollbar{display:none}.pill{flex:none;scroll-snap-align:start}
.pill{display:inline-flex;align-items:center;gap:9px;padding:12px 18px;border-radius:99px;border:1px solid rgba(212,175,55,.38);background:linear-gradient(160deg,#16395c,#0c2238);color:var(--text);font:600 15px "Noto Sans Bengali",system-ui,sans-serif;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 14px rgba(0,0,0,.28);transition:transform .15s,background .15s,color .15s}
.pill em{font-style:normal;font-size:11px;color:var(--gold);border:1px solid rgba(212,175,55,.5);border-radius:99px;padding:1px 7px}
.pill.on,.pill:active{background:linear-gradient(160deg,#e3c25a,#c9a22c);color:#241a00;border-color:#f0d98a;font-weight:700}
.pill.on em,.pill:active em{color:#241a00;border-color:rgba(36,26,0,.5)}
.topbar h2 small{display:block;font:400 11px "Noto Sans Bengali",system-ui,sans-serif;color:var(--dim);margin-top:2px}
@media(prefers-reduced-motion:reduce){.pill{transition:none}}
.topbar{display:flex;align-items:center;gap:10px;margin:4px 0 12px}.back{background:linear-gradient(160deg,#16395c,#0c2238);border:1px solid rgba(212,175,55,.4);color:var(--gold2);border-radius:99px;padding:8px 12px;font:inherit;font-size:13px;flex:none}.topbar h2{margin:0;font:700 17px/1.3 Georgia,serif}
.go{position:relative;overflow:hidden;border-radius:99px;padding:16px 22px;background:linear-gradient(135deg,#f6e4a0,#d4af37 55%,#b8901f);color:#241a00;font:800 17px Georgia,serif;letter-spacing:.04em;box-shadow:0 10px 24px rgba(212,175,55,.35),inset 0 1px 0 rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;gap:12px;transition:transform .15s,box-shadow .15s}
.go span{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#241a00;color:var(--gold2);font-size:15px}
.go:active{transform:scale(.97);box-shadow:0 4px 12px rgba(212,175,55,.3)}
.go:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
@media(prefers-reduced-motion:reduce){.go:after{animation:none}.go{transition:none}}
.note{border-left:3px solid var(--gold);background:#0a1a2f;padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px;color:#dbe4ee}
.lc ul{margin:12px 0 0;padding-left:20px;font-size:15px}
.lc li{margin-bottom:4px}
b{color:var(--gold2)}
u{text-decoration-color:var(--gold);text-underline-offset:3px;text-decoration-thickness:2px}
/* quiz */
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.center{text-align:center}
.box h2{margin:0 0 8px;font:700 21px Georgia,serif}
.btn{display:block;width:100%;margin-top:14px;padding:14px;border:0;border-radius:10px;background:var(--gold);color:#241a00;font:inherit;font-weight:800;font-size:16px}
.btn.alt{background:transparent;border:1px solid var(--gold);color:var(--gold2)}
.bar{height:6px;background:#1c3a59;border-radius:9px;overflow:hidden;margin-bottom:6px}
.bar span{display:block;height:100%;background:var(--gold);transition:width .25s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-bottom:12px}
.q{font-size:18px;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;margin-bottom:9px;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:#0a1a2f;color:var(--text);font:inherit;font-size:16px}
.opt:disabled{opacity:1}
.opt.ok{border-color:var(--ok);background:#0f3a26}
.opt.bad{border-color:var(--bad);background:#401a1a}
.fb{margin-top:6px;padding:12px 14px;border-radius:10px;background:#0a1a2f;border:1px solid var(--line);font-size:15px}
.score{font:700 46px Georgia,serif;color:var(--gold);margin:6px 0}
.rv{padding:14px 0;border-top:1px solid var(--line);font-size:15px}
.rv .y{color:var(--bad)}.rv .c{color:var(--ok)}
.rv p{margin:4px 0}
.dim{color:var(--dim);font-size:14px}
footer{text-align:center;color:var(--dim);font-size:12px;margin-top:26px}
@media(prefers-reduced-motion:reduce){.bar span{transition:none}}
</style>
</head>

<script>
const $=id=>document.getElementById(id);
/* ===== টপিক ডেটা: নতুন টপিক যোগ করতে TOPICS-এ একই কাঠামোর একটি অবজেক্ট দিলেই হবে ===== */
const OLD=[
{id:"pos",name:"Parts of Speech",
lessons:[
["Noun","বিশেষ্য","কোনো ব্যক্তি, বস্তু, স্থান বা ভাবের নামকে Noun বলে।","Common, Proper, Collective, Material ও Abstract—এই পাঁচ প্রকার। Proper noun-এর প্রথম অক্ষর সবসময় বড় হাতের হয়।","<b>Dhaka</b> is a big city.|<b>Honesty</b> is the best policy.","<b>information, advice, furniture, luggage, news</b> Uncountable—এদের আগে a/an বসে না, শেষে -s হয় না: <b>much information</b> (informations ভুল)।|<b>news, mathematics, physics, economics</b> দেখতে plural, কিন্তু singular verb নেয়: News <b>is</b> good।|Collective noun পুরো দল হিসেবে বোঝালে singular verb নেয়: The committee <b>has</b> decided।|Noun মাঝে মাঝে adjective-এর কাজ করে: <b>school</b> bus, <b>stone</b> wall।|<b>two-taka note, ninety-year-old woman</b>: সংখ্যাযুক্ত compound বিশেষণে noun singular থাকে (two-takas ভুল)।|টাকা, দূরত্ব, ওজনের পরিমাণ এক একক ধরলে singular verb: One hundred taka <b>is</b> a good sum।|<b>Common Gender:</b> neighbour, sibling, orphan, sovereign পুরুষ বা নারী দুই-ই হতে পারে।|Plural: <b>sheep, fish, aircraft</b> একই থাকে; <b>ovum → ova, louse → lice, criterion → criteria</b>।|প্রতিশ্রুতি অর্থে <b>word</b>: Be true to your <b>word</b>।"],
["Pronoun","সর্বনাম","Noun-এর বদলে যে শব্দ বসে, তাকে Pronoun বলে। এতে একই noun বারবার লিখতে হয় না।","Pronoun-এর রূপ বদলায়: I (subject), me (object), my (possessive)। Preposition-এর পর object form বসে।","Rina lost <b>her</b> pen, so <b>she</b> bought a new one.|Give it to <b>me</b>.","<b>who</b> subject-এর জায়গায়, <b>whom</b> object-এর জায়গায়: Whom did you see?|<b>its</b> = তার (possessive), <b>it’s</b> = it is। দুটি গুলিয়ে ফেলা খুব সাধারণ ভুল।|<b>everyone, anyone, nobody, each</b> singular verb নেয়: Everyone <b>is</b> present।|Preposition-এর পর object form: between you and <b>me</b> (between you and I ভুল)।|<b>Let</b>-এর পর object form বসে: Let <b>you and him</b> be witnesses।|দ্বিতীয়বার noun না লিখে possessive pronoun দাও: My bike is faster than <b>yours</b>।|<b>Each of / Every one of</b>-এর পর singular: Each of the sons followed <b>his</b> father’s trade।|<b>whose</b> মালিকানা বোঝায়: a room <b>whose</b> windows were closed।|Verb-এর কর্তা দরকার হলে subject form: Tell me <b>who</b> told you that।"],
["Verb","ক্রিয়া","কাজ করা বা অবস্থা বোঝাতে যে শব্দ বসে, তাকে Verb বলে।","Subject-এর person ও number অনুযায়ী verb বসে: He <b>goes</b>, They <b>go</b>। Tense-ও verb দিয়েই বোঝা যায়।","She <b>sings</b> well.|They <b>are</b> students.","<b>Transitive</b> verb-এর object লাগে: He opened the door। <b>Intransitive</b>-এর লাগে না: The door opened।|<b>look, seem, become, feel</b> linking verb হলে পরে adjective বসে: She looks <b>beautiful</b> (beautifully ভুল)।|একই verb Auxiliary ও Main দুটোই হতে পারে: She <b>is</b> reading (auxiliary), She <b>is</b> a doctor (main)।"],
["Adjective","বিশেষণ","Noun বা pronoun-এর গুণ, সংখ্যা বা অবস্থা বোঝায়।","Adjective সাধারণত noun-এর আগে বসে অথবা linking verb (is, am, are, seems)-এর পরে বসে।","She is an <b>intelligent</b> girl.|I have <b>three</b> pens.","Adjective-এর ক্রম: মতামত → আকার → বয়স → রং → দেশ → উপাদান: a lovely small old red Persian wool carpet।|<b>few</b> = প্রায় নেই (নেতিবাচক), <b>a few</b> = অল্প কিছু আছে (ইতিবাচক)। <b>little</b> ও <b>a little</b>-ও একইভাবে।|Double comparative ভুল: more better, more taller। শুদ্ধ: <b>better, taller</b>।|<b>a little</b> uncountable-এর সঙ্গে (a little money), <b>a few</b> countable-এর সঙ্গে (a few friends)।|<b>Determiner</b> noun-এর আগে বসে: a, the, some, any, much, many—Will it take <b>much</b> time?|<b>above</b> noun-এর আগে বসলে adjective: the <b>above</b> address।"],
["Article","আর্টিকেল","a, an, the—noun-এর আগে বসে noun-কে অনির্দিষ্ট বা নির্দিষ্ট করে।","a/an অনির্দিষ্ট (যে-কোনো একটি), the নির্দিষ্ট (জানা বা আগে বলা)। স্বরধ্বনির উচ্চারণ দিয়ে শুরু শব্দের আগে an বসে।","I saw <b>a</b> boy. <b>The</b> boy was crying.|<b>an</b> hour, <b>a</b> university","<b>the + জাতীয়তা</b> = সেই দেশের মানুষ: She speaks English like <b>the</b> English।|ভাষার নামের আগে the বসে না: She speaks <b>English</b>।"],
["Adverb","ক্রিয়াবিশেষণ","Verb, adjective বা অন্য adverb-কে modify করে—কীভাবে, কখন, কোথায়, কতটা তা জানায়।","Adjective-এর শেষে -ly যোগ করে অনেক adverb হয় (quick → quickly)। কিন্তু সব -ly শব্দ adverb নয়: friendly, lovely হলো adjective।","He walked <b>slowly</b>.|The tea is <b>very</b> hot.","Linking verb-এর পর adverb নয়, adjective বসে: She looks <b>beautiful</b>।|<b>good</b> adjective, <b>well</b> adverb: He plays <b>well</b>।|দুই অর্থ: <b>hard</b> (কঠোরভাবে) ও <b>hardly</b> (প্রায় না); <b>late</b> (দেরিতে) ও <b>lately</b> (সম্প্রতি)।|<b>fast, early, late, hard</b> adjective ও adverb দুটোর রূপই এক।|<b>some time</b> (কিছু সময়), <b>sometime</b> (কোনো এক সময়), <b>sometimes</b> (মাঝে মাঝে): I spent <b>some time</b> with the patient।|<b>leisurely, cowardly, friendly</b>-এর শেষে -ly থাকলেও এরা adjective: a leisurely stroll।"],
["Preposition","পদান্বয়ী অব্যয়","Noun বা pronoun-এর আগে বসে অন্য শব্দের সঙ্গে তার সম্পর্ক (স্থান, সময়, দিক) বোঝায়।","Preposition-এর পর pronoun থাকলে object form বসে: with <b>him</b>, to <b>me</b> (with he ভুল)।","The book is <b>on</b> the table.|She arrived <b>at</b> noon.","নির্দিষ্ট ঘনিষ্ঠ সঙ্গী মুখস্থ রাখতে হয়: <b>afraid of, good at, interested in, depend on, married to, different from</b>।|সময়ে: <b>at</b> 5 pm, <b>on</b> Friday, <b>in</b> July।|Preposition-এর পর verb থাকলে -ing বসে: interested in <b>reading</b> (to read ভুল)।|Preposition বাক্যের শেষেও বসতে পারে: Who are you talking <b>to</b>?|<b>following, regarding, concerning</b> verb-ing রূপে থাকলেও preposition হতে পারে: following the wedding (বিয়ের পর)।"],
["Conjunction","সংযোজক অব্যয়","শব্দ, বাক্যাংশ বা বাক্যকে যুক্ত করে।","and, but, or, so হলো Coordinating; because, although, if, when হলো Subordinating conjunction।","I like tea <b>and</b> coffee.|He stayed home <b>because</b> it rained.","<b>Although / Though</b>-এর সঙ্গে but বসে না: Although he is poor, he is honest।|<b>Because</b>-এর সঙ্গে so বসে না।|জোড়া conjunction: <b>Either…or, Neither…nor, Not only…but also</b>—দুই পাশে একই ধরনের শব্দ বসাতে হয়।|<b>No sooner…than</b>, <b>Hardly…when</b>: এই জোড়া গুলিয়ে ফেলা হয়।|<b>in case</b> = সতর্কতার জন্য: Take my number <b>in case</b> you get lost।|<b>provided (that)</b> conjunction, শর্ত বোঝায়: I shall help you <b>provided</b> you obey me।"],
["Interjection","আবেগসূচক অব্যয়","হঠাৎ আনন্দ, দুঃখ, বিস্ময় ইত্যাদি অনুভূতি প্রকাশ করে।","বাক্যের বাকি অংশের সঙ্গে এর grammatical সম্পর্ক থাকে না। সাধারণত পরে (!) বসে।","<b>Wow</b>! What a view.|<b>Alas</b>! He failed.","<b>Well</b> কখনো interjection (Well! I didn’t expect that), কখনো adverb (He sings well)।|দুই বা ততোধিক শব্দেও হয়: <b>Good heavens!</b> <b>Thank goodness!</b>"],
["Tricky Cases","একই শব্দ, ভিন্ন রূপ","একই শব্দ বাক্যে কী কাজ করছে, তার ওপরই নির্ভর করে সেটি কোন Parts of Speech।","শব্দ দেখে নয়, বাক্যে তার কাজ দেখো: এটি কি নাম (noun)? কাজ (verb)? গুণ (adjective)? কীভাবে বা কতটা (adverb)?","The <b>light</b> is bright. (Noun)|This bag is <b>light</b>. (Adjective)|Please <b>light</b> the lamp. (Verb)|He runs <b>fast</b>. (Adverb)|He is a <b>fast</b> runner. (Adjective)","<b>after</b> হতে পারে preposition (after lunch), conjunction (after he left) বা adverb (soon after)।|<b>that</b> হতে পারে pronoun, conjunction বা adjective।|<b>home</b> (go home) ও <b>down</b> (The sun went down) বাক্যে adverb; <b>home</b> noun-ও হয়।"]
],

{s:"Tricky Cases",b:"41st BCS",q:"‘Come on, it’s time to go home.’ Here ‘home’ is a/an—",o:["noun", "verb", "adjective", "adverb"],a:3,e:"go home-এ home কাজটি কোথায় হবে তা বলছে, তাই Adverb।"},

{s:"Noun",b:"50th BCS",q:"What gender is the word ‘monarch’?",o:["masculine", "feminine", "neuter", "common"],a:3,e:"monarch (রাজা বা রানি) পুরুষ ও নারী দুই-ই হতে পারে, তাই Common Gender।"},

{id:"tense",name:"Tense",
lessons:[
["Tense কী?","কালের ধারণা","Verb-এর যে রূপ কাজ হওয়ার সময় ও অবস্থা বোঝায়, তাকে Tense বলে।","মূল তিন প্রকার: Present, Past ও Future। প্রতিটির চারটি রূপ: Indefinite, Continuous, Perfect ও Perfect Continuous। মোট ১২টি Tense।","Present: He <b>plays</b> cricket.|Past: He <b>played</b> cricket.|Future: He <b>will play</b> cricket."],
["Present Tense","বর্তমান কাল","বর্তমানের অভ্যাস, চলমান কাজ বা সদ্য শেষ হওয়া কাজ বোঝায়।","Indefinite: Sub + V1 (s/es)<br>Continuous: Sub + am/is/are + V-ing<br>Perfect: Sub + has/have + V3<br>Perfect Continuous: Sub + has/have been + V-ing","He <b>plays</b> cricket every day. (অভ্যাস)|She <b>is reading</b> now. (চলমান)|I <b>have finished</b> the work. (সদ্য শেষ)|He <b>has been waiting</b> for two hours. (শুরু থেকে এখনো চলছে)"],
["Past Tense","অতীত কাল","অতীতে ঘটে যাওয়া কাজ বা অবস্থা বোঝায়।","Indefinite: Sub + V2<br>Continuous: Sub + was/were + V-ing<br>Perfect: Sub + had + V3<br>Perfect Continuous: Sub + had been + V-ing","She <b>went</b> to school yesterday.|They <b>were playing</b> when it began to rain.|The train <b>had left</b> before I reached.|He <b>had been studying</b> for two hours when I came."],
["Future Tense","ভবিষ্যৎ কাল","ভবিষ্যতে ঘটবে এমন কাজ বা অবস্থা বোঝায়।","Indefinite: Sub + will/shall + V1<br>Continuous: Sub + will be + V-ing<br>Perfect: Sub + will have + V3<br>Perfect Continuous: Sub + will have been + V-ing","I <b>will call</b> you tomorrow.|He <b>will be sleeping</b> at 10 pm.|She <b>will have finished</b> the work by 5 pm.|By June, I <b>will have been living</b> here for five years."],
["পরীক্ষায় আসা নিয়ম","গুরুত্বপূর্ণ টিপস","সময়ের শব্দ দেখে Tense ঠিক করা যায়।","<b>since</b> = নির্দিষ্ট সময়ের শুরু (since 2015); <b>for</b> = সময়ের পরিমাণ (for ten years)। <b>yesterday, ago, last</b> থাকলে Past Indefinite বসে, Present Perfect নয়। If/when/before/after-এর clause-এ ভবিষ্যৎ অর্থ হলেও Present Indefinite বসে।","I met him <b>yesterday</b>. (have met ভুল)|He has lived here <b>since</b> 2015.|If it <b>rains</b>, we will stay home.|I <b>know</b> him. (know, like, want সাধারণত Continuous হয় না)"]
],
mcqs:[
{q:"He ____ cricket every day.",o:["plays","is playing","played","has played"],a:0,e:"প্রতিদিনের অভ্যাস বোঝাতে Present Indefinite বসে। He-এর সঙ্গে verb-এ s যুক্ত হয়।"},
{q:"Look! The baby ____.",o:["sleeps","is sleeping","slept","has slept"],a:1,e:"Look! বলায় এখনই চলছে এমন কাজ বোঝাচ্ছে, তাই Present Continuous (is sleeping)।"},
{q:"I ____ him since 2015.",o:["know","am knowing","have known","knew"],a:2,e:"since থাকলে Present Perfect বসে। know একটি stative verb, তাই Continuous হয় না।"},
{q:"He has been waiting ____ two hours.",o:["since","for","from","at"],a:1,e:"two hours সময়ের পরিমাণ, তাই for বসে। নির্দিষ্ট শুরুর সময়ের আগে since বসে।"},
{q:"We ____ a movie when the power went out.",o:["watched","were watching","had watched","are watching"],a:1,e:"অতীতে একটি কাজ চলার মধ্যে অন্য কাজ ঘটলে Past Continuous (were watching) বসে।"},
{q:"The train ____ before I reached the station.",o:["left","was leaving","had left","has left"],a:2,e:"অতীতের দুটি কাজের আগেরটিতে Past Perfect (had left) বসে।"},
{q:"I ____ him yesterday.",o:["have met","met","had met","meet"],a:1,e:"yesterday থাকলে Past Indefinite বসে, Present Perfect বসে না।"},
{q:"I ____ you tomorrow.",o:["called","will call","have called","call"],a:1,e:"tomorrow ভবিষ্যৎ বোঝায়, তাই Future Indefinite (will call)।"},
{q:"By next June, she ____ her degree.",o:["will complete","will have completed","has completed","completes"],a:1,e:"By + ভবিষ্যৎ সময় থাকলে ওই সময়ের মধ্যে কাজ শেষ হবে বোঝায়, তাই Future Perfect।"},
{q:"If it ____ tomorrow, we will stay at home.",o:["will rain","rains","rained","would rain"],a:1,e:"If-clause-এ ভবিষ্যৎ অর্থ হলেও Present Indefinite (rains) বসে।"}
]},
{id:"articles",name:"Articles",
lessons:[
["A / An", "অনির্দিষ্ট আর্টিকেল", "যে-কোনো একটি, অর্থাৎ অনির্দিষ্ট singular countable noun-এর আগে a বা an বসে।", "বানান নয়, উচ্চারণের প্রথম ধ্বনি দেখো: consonant ধ্বনির আগে a, vowel ধ্বনির আগে an।", "<b>a</b> book, <b>a</b> doctor|<b>an</b> apple, <b>an</b> egg", "<b>an hour, an honest man</b>: h নীরব, তাই an।|<b>a university, a unique case, a European</b>: শুরু ‘ইউ’ ধ্বনিতে (consonant), তাই a।|<b>a one-eyed man</b>: শুরু ‘ওয়ান’ ধ্বনিতে, তাই a।|<b>an MBBS, an M.A.</b>: অক্ষরের উচ্চারণ ‘এম’ (vowel ধ্বনি), তাই an।|Uncountable ও plural noun-এর আগে a/an বসে না।"],
["The", "নির্দিষ্ট আর্টিকেল", "নির্দিষ্ট বা পরিচিত noun-এর আগে the বসে, যার কথা বক্তা ও শ্রোতা দুজনেই জানে বা আগে একবার উল্লেখ হয়েছে।", "একবার a দিয়ে পরিচয় করালে পরের বার সেই noun-এর আগে the বসে।", "I bought <b>a</b> pen. <b>The</b> pen is red.|<b>The</b> sun rises in the east.", "অনন্য বস্তু: <b>the sun, the moon, the earth</b>।|নদী, সাগর, পর্বতমালা: <b>the Meghna, the Himalayas</b>।|Superlative ও ordinal: <b>the best, the first</b>।|পবিত্র গ্রন্থ: <b>the Quran, the Bible</b>।|<b>the + জাতীয়তা</b> = সেই জাতির মানুষ: She speaks English like <b>the</b> English।|<b>the + adjective</b> = সেই শ্রেণির মানুষ: <b>the rich, the poor</b>।"],
["No Article", "আর্টিকেল বসে না", "কিছু ক্ষেত্রে noun-এর আগে কোনো article বসে না।", "সাধারণ অর্থে বলা noun, ভাষা, খেলা ও নামবাচক শব্দের আগে article লাগে না।", "<b>Bangladesh</b> is a beautiful country.|She speaks <b>English</b>.", "ভাষা, খেলা, মাস, দিন: English, cricket, July, Friday।|Abstract ও material noun সাধারণ অর্থে: <b>Honesty</b> is the best policy।|Meal-এর নাম: I had breakfast at eight।|Plural noun সাধারণ অর্থে: <b>Books</b> are our friends।|ব্যক্তি, দেশ ও শহরের নাম: Rahim, Japan, Dhaka।"],
["Tricky Article Cases", "ফাঁদের ক্ষেত্র", "article বদলালে অনেক সময় অর্থই বদলে যায়।", "a/an, the এবং কোনো article না থাকা: তিন ক্ষেত্রে অর্থের পার্থক্য আলাদা করে মনে রাখো।", "He is <b>a</b> doctor. (পেশা)|He is <b>the</b> doctor. (নির্দিষ্ট একজন)", "<b>a little</b> (অল্প আছে) বনাম <b>little</b> (প্রায় নেই)।|<b>a few</b> (কয়েকটি আছে) বনাম <b>few</b> (প্রায় নেই)।|‘প্রতি’ অর্থে a: twice <b>a</b> day।|<b>the same, the only, the whole</b>-এর আগে the বসে।|the + singular noun গোটা শ্রেণি বোঝায়: <b>The</b> cow is a useful animal।"]
],
mcqs:[
{s:"A / An",b:"28th BCS",q:"Which sentence is correct?",o:["This is an unique case", "This is a unique case", "This is a very unique case", "This is the most unique case"],a:1,e:"unique-এর শুরু ‘ইউ’ ধ্বনিতে (consonant), তাই an নয়, a। unique-এর আগে very বা most বসে না।"},
{s:"A / An",b:"37th BCS",q:"Use the appropriate article: I saw ____ one-eyed man when I was walking on the road.",o:["a", "an", "the", "no article is needed"],a:0,e:"one-eyed শুরু হয় ‘ওয়ান’ (w) ধ্বনিতে, যা consonant ধ্বনি, তাই a।"},
{s:"A / An",b:"47th BCS",q:"Where there is ____ will, there is ____ way.",o:["the, a", "a, a", "a, the", "the, the"],a:1,e:"প্রবাদটি: Where there is a will, there is a way।"},
{s:"A / An",q:"He is ____ MBBS doctor.",o:["a", "an", "the", "no article"],a:1,e:"MBBS-এর উচ্চারণ শুরু ‘এম’ (vowel ধ্বনি) দিয়ে, তাই an।"},
{s:"A / An",q:"She waited for ____ hour.",o:["a", "an", "the", "no article"],a:1,e:"hour-এর h নীরব, উচ্চারণ vowel ধ্বনিতে, তাই an।"},
{s:"The",q:"____ sun rises in the east.",o:["A", "An", "The", "No article"],a:2,e:"সূর্য অনন্য বস্তু, তাই the।"},
{s:"The",b:"45th BCS",q:"Identify the correct sentence:",o:["She speaks English like English", "She speaks the English like English", "She speaks the English like the English", "She speaks English like the English"],a:3,e:"ভাষা English-এর আগে the নয়, কিন্তু জাতি বোঝাতে the English।"},
{s:"The",q:"“The rich are not always happy.” Here ‘the rich’ means—",o:["a rich man", "rich people", "richness", "a rich thing"],a:1,e:"the + adjective = সেই শ্রেণির মানুষ (plural)।"},
{s:"The",q:"Which sentence is correct?",o:["I read the Quran daily.", "I have the breakfast at eight.", "She is the Bangladeshi.", "He plays the cricket."],a:0,e:"পবিত্র গ্রন্থের আগে the বসে; meal, খেলা ও জাতীয়তা-বিশেষণের আগে the বসে না।"},
{s:"No Article",q:"____ honesty is the best policy.",o:["The", "An", "A", "No article"],a:3,e:"Abstract noun সাধারণ অর্থে বললে article বসে না।"},
{s:"No Article",q:"He plays ____ cricket every evening.",o:["a", "an", "the", "no article"],a:3,e:"খেলার নামের আগে article বসে না।"},
{s:"Tricky Article Cases",q:"‘Few friends came’ means—",o:["some friends came", "almost no friends came", "many friends came", "exactly one friend came"],a:1,e:"few (a ছাড়া) = প্রায় নেই; a few = কয়েকজন আছে।"},
{s:"Tricky Article Cases",q:"He takes medicine twice ____ day.",o:["an", "a", "the", "no article"],a:1,e:"‘প্রতি’ অর্থে a বসে: twice a day।"}
]},
{id:"prep",name:"Prepositions",
lessons:[
["Time & Place", "সময় ও স্থানের Preposition", "at, on, in: সময় ও জায়গার ব্যাপ্তি অনুযায়ী ছোট থেকে বড়, তিনটি ভাগ।", "at = নির্দিষ্ট বিন্দু, on = দিন/তারিখ বা পৃষ্ঠ, in = বড় সময় বা ঘেরা জায়গা।", "The class starts <b>at</b> 9 o’clock.|I will meet you <b>on</b> Friday.|She was born <b>in</b> July.", "সময়: <b>at</b> noon/night, <b>on</b> Monday/5 May, <b>in</b> July/2020/the morning।|স্থান: <b>at</b> the bus stop, <b>on</b> the table, <b>in</b> Dhaka।|<b>since</b> + সময়বিন্দু (since 2015), <b>for</b> + সময়কাল (for two years)।"],
["Dependent Prepositions", "নির্দিষ্ট সঙ্গী", "কিছু verb ও adjective-এর সঙ্গে নির্দিষ্ট preposition-ই বসে, নিয়ম নেই, মুখস্থ করতে হয়।", "একই verb আলাদা preposition নিয়ে আলাদা অর্থ দেয়: look <b>at</b> (তাকানো), look <b>after</b> (দেখাশোনা), look <b>down on</b> (তুচ্ছ করা)।", "She is <b>interested in</b> music.|He is <b>afraid of</b> snakes.", "<b>afraid of, fond of, proud of, good at, interested in, married to, different from</b>।|<b>depend on, insist on, look down on, look forward to, take to task</b>।|<b>take someone to task</b> = তিরস্কার করা।"],
["Gerund & Pronoun", "Preposition-এর পর কী বসে", "Preposition-এর পর verb থাকলে -ing (gerund) বসে এবং সর্বনাম থাকলে object form বসে।", "to infinitive-এর to আর preposition to আলাদা: look forward <b>to seeing</b> (to = preposition)।", "He is fond of <b>reading</b> novels.|Her parents approved of <b>her going</b> abroad.", "<b>interested in reading</b> (to read নয়)।|<b>look forward to meeting, used to driving, object to going</b>: এখানে to preposition, তাই -ing।|Preposition-এর পর pronoun: with <b>him</b>, between you and <b>me</b>।"],
["Look-alikes", "একই রকম, ভিন্ন অর্থ", "দেখতে কাছাকাছি কিন্তু অর্থ আলাদা, এমন preposition জোড়া।", "দুইয়ের মধ্যে between, দুইয়ের বেশির মধ্যে among।", "The prize was shared <b>among</b> the three boys.|The match is <b>between</b> Bangladesh and India.", "<b>between</b> (দুজন/দুটি) বনাম <b>among</b> (দুইয়ের বেশি)।|<b>beside</b> (পাশে) বনাম <b>besides</b> (ছাড়াও)।|<b>in time</b> (সময় থাকতে) বনাম <b>on time</b> (ঠিক সময়ে)।|<b>different from</b> (different than/to নয়)।"],
["Preposition or Not?", "শব্দটি কোন Parts of Speech", "একই শব্দ বাক্যে preposition, adverb, conjunction বা adjective হতে পারে।", "noun বা pronoun-এর আগে বসে সম্পর্ক দেখালে সেটি preposition।", "A reception <b>following</b> the wedding.|Call me about problems <b>regarding</b> your work.", "<b>following, regarding, concerning, including</b> noun-এর আগে বসলে preposition।|<b>down</b> একা বসলে adverb: The sun went down। <b>down</b> noun-এর আগে বসলে preposition: down the road।|<b>above</b> noun-এর আগে বসলে adjective: the above address।|<b>before, after, since</b> clause যুক্ত করলে conjunction।"]
],

{s:"Time & Place",q:"She was born ____ July.",o:["at", "on", "in", "by"],a:2,e:"মাস ও বছরের আগে in।"},
{s:"Dependent Prepositions",q:"He is afraid ____ snakes.",o:["of", "to", "at", "from"],a:0,e:"afraid of—নির্দিষ্ট সঙ্গী।"},
{s:"Dependent Prepositions",q:"The supervisor took him ____ task for his negligence.",o:["for", "at", "to", "by"],a:2,e:"take someone to task = তিরস্কার করা।"},
{s:"Dependent Prepositions",q:"You should never look down ____ the poor.",o:["at", "to", "about", "on"],a:3,e:"look down on = তুচ্ছ করা।"},
{s:"Dependent Prepositions",q:"She is interested ____ music.",o:["on", "at", "in", "with"],a:2,e:"interested in—নির্দিষ্ট সঙ্গী।"},
{s:"Gerund & Pronoun",q:"Her parents never approved of ____ abroad.",o:["her to go", "her going", "her going to", "her not going to"],a:1,e:"Preposition of-এর পর gerund (going) ও possessive her বসে।"},
{s:"Gerund & Pronoun",q:"He is fond of ____ novels.",o:["read", "to read", "reading", "for read"],a:2,e:"Preposition-এর পর verb থাকলে -ing।"},
{s:"Gerund & Pronoun",q:"I look forward to ____ you soon.",o:["see", "seeing", "saw", "seen"],a:1,e:"এখানে to preposition, তাই পরে -ing।"},
{s:"Look-alikes",q:"The chocolates were divided ____ the three children.",o:["between", "among", "beside", "besides"],a:1,e:"দুইয়ের বেশি হলে among।"},
{s:"Look-alikes",q:"She sat ____ me.",o:["besides", "beside", "between", "beyond"],a:1,e:"beside = পাশে।"},
{s:"Look-alikes",q:"I have lived here ____ 2015.",o:["for", "from", "since", "in"],a:2,e:"নির্দিষ্ট সময়বিন্দুর আগে since।"},
{s:"Preposition or Not?",b:"39th BCS",q:"There was a small reception following the wedding. The word ‘following’ is—",o:["adjective", "adverb", "noun", "preposition"],a:3,e:"following noun wedding-এর আগে বসে সময়ের সম্পর্ক (পরে) দেখাচ্ছে।"},
{s:"Preposition or Not?",b:"41st BCS",q:"Call me if you have any problems regarding your work. Here ‘regarding’ is a/an—",o:["gerund", "apposition", "preposition", "conjunction"],a:2,e:"regarding = সম্পর্কে; noun-এর আগে বসে সম্পর্ক বোঝাচ্ছে।"},
{s:"Preposition or Not?",b:"50th BCS",q:"‘You will need a variety of skills, including leadership, endurance etc.’ Here ‘including’ is a—",o:["conjunction", "gerund", "participle", "preposition"],a:3,e:"including = সহ; noun leadership-এর আগে বসে সম্পর্ক বোঝাচ্ছে।"}
]},
{id:"rfv",name:"Right Form of Verbs",
lessons:[
["Subject–Verb Agreement", "কর্তা ও ক্রিয়ার মিল", "Subject singular হলে verb singular, plural হলে verb plural হয়।", "Subject খুঁজে বের করো। মাঝের phrase বা পরের noun দেখে verb ঠিক কোরো না।", "Each of the boys <b>has</b> a pen.|The teacher, along with his students, <b>is</b> coming.", "<b>Each of, Every one of, One of, Neither of</b>-এর পর plural noun থাকলেও verb singular।|<b>with, along with, as well as, together with</b> দিয়ে যুক্ত হলে verb প্রথম subject অনুযায়ী।|<b>Neither…nor, Either…or, Not only…but also</b>: verb কাছের subject অনুযায়ী: Neither he nor they <b>are</b> ready।|<b>The number of</b> + plural noun = singular verb; <b>A number of</b> + plural noun = plural verb।|<b>Many a</b> + singular noun = singular verb: Many a man <b>has</b> failed।|<b>Mathematics, news, physics</b> singular; <b>the + adjective</b> (the poor) plural verb নেয়।"],
["Tense ও Verb Form", "Tense অনুযায়ী Verb-এর রূপ", "বাক্যের সময়ের সংকেত দেখে verb-এর সঠিক রূপ (V1, V2, V3) বেছে নিতে হয়।", "since, for, already, yet দেখলে Present Perfect; before/by the time + past দেখলে Past Perfect।", "I <b>have lived</b> here since 2015.|The train <b>had left</b> before I reached.", "<b>If + Present, will + V1</b> (সম্ভাব্য)।|<b>If + Past, would + V1</b>: If I <b>were</b> you, I would accept it।|<b>If + had + V3, would have + V3</b>: If he had worked hard, he <b>would have passed</b>।|<b>wish / as if / as though</b>-এর পর past: I wish I <b>were</b> a bird; He talks as if he <b>knew</b> everything।|Passive: <b>be + V3</b>।"],
["Gerund", "Verb + ing = Noun", "Verb-এর সঙ্গে -ing যোগ হয়ে যখন noun-এর কাজ করে, তখন তাকে Gerund বলে।", "চেনার কৌশল: -ing শব্দটি subject, object বা preposition-এর পরে noun-এর মতো বসে এবং ‘কাজটি’ দিয়ে প্রতিস্থাপন করা যায়।", "<b>Subject:</b> <b>Swimming</b> is a good exercise.|<b>Object:</b> He enjoys <b>swimming</b>.|<b>Preposition-এর object:</b> She is fond of <b>singing</b>.|<b>Complement:</b> His hobby is <b>reading</b>.|<b>Possessive-এর পর:</b> I don’t like <b>his coming</b> late.|<b>Gerund নেয় এমন verb:</b> enjoy, avoid, mind, finish, suggest, deny, admit, practise, postpone, consider, miss, risk।", "<b>Fixed গঠন:</b> It is no use / no good / worth + V-ing; cannot help; there is no point in; feel like; look forward to; object to; be used to।|<b>Preposition-এর পর সবসময় V-ing</b>, কখনো to V1 নয়: interested in <b>reading</b>।|<b>Gerund বনাম Participle:</b> a <b>swimming</b> pool = সাঁতারের জন্য pool (gerund); a <b>swimming</b> boy = যে boy সাঁতার কাটছে (participle)।"],
["Participle", "Verb + Adjective", "Verb থেকে তৈরি যে শব্দ adjective-এর কাজ করে এবং verb-এর ভাবও ধরে রাখে, তাকে Participle বলে।", "তিন প্রকার: Present Participle (V-ing), Past Participle (V3) ও Perfect Participle (having + V3)।", "<b>Present (V-ing):</b> চলমান বা সক্রিয় অর্থ: a <b>crying</b> baby, a <b>running</b> horse।|<b>Past (V3):</b> সম্পন্ন বা passive অর্থ: a <b>broken</b> window, a <b>boiled</b> egg, a <b>wounded</b> man।|<b>Perfect (having + V3):</b> আগে শেষ হওয়া কাজ: <b>Having finished</b> the work, he went home।|<b>Verb-এর অংশ হিসেবেও:</b> is <b>going</b>, has <b>gone</b>, was <b>broken</b>।|<b>Participle phrase:</b> <b>Walking</b> along the road, I saw a snake।", "<b>-ing বনাম -ed:</b> যা অনুভূতি জাগায় তা -ing, যে অনুভব করে সে -ed: The film is <b>boring</b>; I am <b>bored</b>। interesting/interested, exciting/excited, shocking/shocked।|<b>Dangling participle ভুল:</b> phrase-এর কর্তা ও main clause-এর কর্তা একই হতে হবে। Walking along the road, a snake bit me (ভুল); Walking along the road, <b>I saw</b> a snake (শুদ্ধ)।|<b>Having + V3</b> আগের কাজ বোঝায়, V-ing একই সময়ের কাজ বোঝায়।"],
["Infinitive", "to + V1", "Verb-এর মূল রূপ (V1), সাধারণত to-এর সঙ্গে, যা noun, adjective বা adverb-এর কাজ করে। কর্তা বা tense অনুযায়ী বদলায় না।", "দুই প্রকার: To-Infinitive (to + V1) এবং Bare Infinitive (to ছাড়া V1)।", "<b>Noun-এর কাজ:</b> <b>To err</b> is human. He wants <b>to go</b>.|<b>Adjective-এর কাজ:</b> I need water <b>to drink</b>.|<b>Adverb-এর কাজ (উদ্দেশ্য):</b> He came <b>to learn</b>.|<b>to V1 নেয়:</b> want, decide, hope, plan, refuse, promise, manage, agree, afford, learn, fail, offer, expect।|<b>Bare infinitive বসে:</b> modal (can, may, must, shall, will, should, would, could, might)-এর পর; had better ও would rather-এর পর; make, let, see, hear, watch, feel + object-এর পর (active-এ)।", "<b>too…to</b> ও <b>enough…to</b>: too weak <b>to walk</b>, strong enough <b>to lift</b>।|<b>Passive-এ to ফিরে আসে:</b> The teacher made him read → He was made <b>to read</b>।|<b>Infinitive-এর to</b> আর <b>preposition to</b> এক নয়: look forward <b>to seeing</b>, object <b>to going</b> (-ing বসে)।|<b>do/does/did-এর পর</b> সবসময় V1: He did not <b>go</b>।"],
["কোনটি কখন?", "Gerund · Participle · Infinitive", "তিনটিই verb থেকে তৈরি, কিন্তু কাজ আলাদা: Gerund = noun, Participle = adjective, Infinitive = noun/adjective/adverb।", "মনে রাখার সূত্র: Preposition-এর পর V-ing; Modal-এর পর V1; ইচ্ছা, সিদ্ধান্ত ও পরিকল্পনার verb-এর পর to V1।", "<b>Gerund:</b> Swimming is fun. (noun)|<b>Participle:</b> The swimming boy waved. (adjective)|<b>Infinitive:</b> He loves to swim. (noun)|<b>দুটোই চলে, অর্থ প্রায় একই:</b> like, love, hate, start, begin, continue, prefer।", "<b>stop + V-ing</b> = কাজ বন্ধ করা (He stopped smoking); <b>stop + to V1</b> = থেমে অন্য কাজ করা (He stopped to smoke)।|<b>remember + V-ing</b> = আগে করেছি মনে আছে (I remember meeting him); <b>remember + to V1</b> = করতে হবে, ভুলো না (Remember to lock the door)। forget-এও একই নিয়ম।|<b>try + V-ing</b> = পরীক্ষা করে দেখা; <b>try + to V1</b> = চেষ্টা করা।|<b>regret + V-ing</b> = অতীতের কাজের জন্য অনুতাপ; <b>regret + to V1</b> = দুঃখের সঙ্গে জানাচ্ছি।"],
["Special Structures", "বিশেষ গঠন", "কিছু গঠনে verb-এর রূপ নিয়ম করা থাকে, এগুলো গঠনসহ মুখস্থ রাখো।", "used to + V1 (অতীত অভ্যাস) আর be used to + V-ing (অভ্যস্ত) আলাদা।", "He <b>used to</b> play cricket.|He is <b>used to getting up</b> early.", "<b>would rather, had better</b> + V1: I would rather <b>stay</b> at home।|<b>cannot help, cannot but</b>: I couldn’t help <b>laughing</b>; I cannot but <b>laugh</b>।|<b>It is time / high time</b> + subject + past: It is high time we <b>went</b> home।|<b>prefer</b> V-ing to V-ing: He prefers walking to riding।"]
],

{id:"cond",name:"Conditionals",
lessons:[
["Zero ও Type 1", "সত্য ও সম্ভাব্য শর্ত", "Zero: সাধারণ সত্য বা অভ্যাস। Type 1: ভবিষ্যতে ঘটতে পারে এমন বাস্তব শর্ত।", "Type 1-এর গঠন: <b>If + Present Simple, will/can/may + V1</b>।", "<b>Zero:</b> If you heat ice, it <b>melts</b>. (If + present, present)|<b>Type 1:</b> If it rains tomorrow, we <b>will stay</b> at home.|<b>Type 1:</b> If he comes early, he <b>can catch</b> the train.", "<b>If-clause-এ will বসে না:</b> If he will come ✗ → If he <b>comes</b> ✓।|<b>Unless = If not:</b> Unless you <b>work</b> hard, you will fail। unless-এর পরে আবার not বসে না (Unless you don’t work ✗)।"],
["Type 2", "অবাস্তব বা অসম্ভাব্য শর্ত (বর্তমান)", "বর্তমান বা ভবিষ্যতে যা ঘটার সম্ভাবনা কম বা অবাস্তব, তার কল্পনা।", "গঠন: <b>If + Past Simple, would/could/might + V1</b>।", "If I <b>had</b> wings, I <b>would fly</b>.|If he <b>worked</b> hard, he <b>would pass</b>.|If I <b>were</b> you, I <b>would accept</b> the offer.", "<b>If-এর পর সব subject-এর সঙ্গে were:</b> If I <b>were</b> you, If she <b>were</b> rich (formal ও পরীক্ষার শুদ্ধ রূপ)।|<b>If-clause-এ would বসে না:</b> If I would be you ✗।|If-clause past দেখালেও অর্থ বর্তমান বা ভবিষ্যৎ।"],
["Type 3", "অবাস্তব শর্ত (অতীত)", "অতীতে যা ঘটেনি, তার জন্য অনুতাপ বা কল্পনা।", "গঠন: <b>If + Past Perfect (had + V3), would/could/might have + V3</b>।", "If he <b>had studied</b> hard, he <b>would have passed</b>.|She <b>would have come</b> if she <b>had been</b> invited.", "<b>Inversion (If বাদ দিয়ে):</b> <b>Had he studied</b>, he would have passed।|<b>If-clause-এ would have বসে না:</b> If he would have studied ✗।|Type 3-এ অতীতের ঘটনা বদলানো যায় না, তাই ফলাফলও অতীত।"],
["Mixed ও Special", "মিশ্র ও বিশেষ গঠন", "মিশ্র conditional-এ শর্ত অতীতের, কিন্তু ফল বর্তমানের।", "Mixed: <b>If + had + V3, would + V1</b>: If I <b>had taken</b> the medicine, I <b>would be</b> well now।", "<b>Inversion:</b> <b>Were</b> I you, I would apologise। (Type 2)|<b>Inversion:</b> <b>Had</b> I known, I would have helped। (Type 3)|<b>Inversion:</b> <b>Should</b> you need help, call me। (Type 1)", "<b>Provided/Providing (that), as long as</b> = শুধু এই শর্তে: You can borrow it <b>provided</b> you return it।|<b>In case</b> = সতর্কতার জন্য: Take an umbrella <b>in case</b> it rains।|<b>But for + noun</b> = যদি না থাকত: <b>But for</b> your help, I would have failed।|<b>Unless</b> নিজেই negative, তাই পরে not লাগে না।"],
["Wish ও As if", "ইচ্ছা ও তুলনা", "wish, if only ও as if-এর পর অবাস্তব বা কল্পিত বিষয় বোঝাতে past form বসে।", "বর্তমানের অবাস্তব ইচ্ছায় <b>past (were)</b>, অতীতের অনুতাপে <b>had + V3</b>।", "I wish I <b>were</b> a bird. (বর্তমান)|I wish I <b>had studied</b> harder last year. (অতীত অনুতাপ)|She behaves as if she <b>were</b> the owner.|I would rather you <b>stayed</b> here.", "<b>If only</b> = wish-এর জোরালো রূপ: If only I <b>had been</b> more careful yesterday!|<b>as if / as though</b>: বর্তমান কল্পনায় past (He talks as if he knew everything), অতীত কল্পনায় had + V3।|<b>would rather + subject + past</b> (বর্তমান/ভবিষ্যৎ): I would rather you stayed।"]
],
mcqs:[
{s:"Zero ও Type 1",q:"If you heat ice, it ____.",o:["melt", "melts", "would melt", "melted"],a:1,e:"Zero conditional-এ দুই অংশেই present।"},
{s:"Zero ও Type 1",q:"If it rains tomorrow, we ____ at home.",o:["stayed", "would stay", "will stay", "stay"],a:2,e:"Type 1: If + present, will + V1।"},
{s:"Zero ও Type 1",q:"Unless you ____ hard, you will fail.",o:["don’t work", "work", "will work", "worked"],a:1,e:"unless = if not, তাই পরে negative বসে না।"},
{s:"Zero ও Type 1",q:"If he ____ early, he will catch the train.",o:["will come", "would come", "comes", "came"],a:2,e:"If-clause-এ will বসে না, present বসে।"},
{s:"Zero ও Type 1",q:"I will call you if I ____ time.",o:["will have", "would have", "had", "have"],a:3,e:"Type 1: If-clause-এ present।"},
{s:"Type 2",q:"If I ____ you, I would accept the offer.",o:["am", "was", "were", "be"],a:2,e:"অবাস্তব শর্তে If-এর পর were।"},
{s:"Type 2",q:"If she ____ rich, she would buy a car.",o:["is", "were", "will be", "had been"],a:1,e:"Type 2: If + past (were)।"},
{s:"Type 2",q:"If I had wings, I ____ fly.",o:["will", "would", "would have", "had"],a:1,e:"Type 2-এর ফলে would + V1।"},
{s:"Type 2",q:"If he worked hard, he ____ the exam.",o:["will pass", "would pass", "would have passed", "passes"],a:1,e:"If + past (worked) হলে would + V1।"},
{s:"Type 3",q:"If he had studied hard, he ____ the exam.",o:["would pass", "will pass", "would have passed", "had passed"],a:2,e:"Type 3: If + had + V3, would have + V3।"},
{s:"Type 3",q:"If I ____ the news earlier, I would have helped you.",o:["knew", "know", "had known", "would know"],a:2,e:"Type 3-এর If-clause-এ had + V3।"},
{s:"Type 3",q:"She would have come if she ____ invited.",o:["was", "were", "had been", "has been"],a:2,e:"Type 3-এর If-clause-এ had been।"},
{s:"Type 3",q:"____ he studied, he would have passed.",o:["Did", "Had", "Has", "Was"],a:1,e:"Had he studied = If he had studied (inversion)।"},
{s:"Mixed ও Special",q:"If I had taken the medicine, I ____ well now.",o:["would have been", "would be", "will be", "am"],a:1,e:"অতীত শর্ত, বর্তমান ফল: would + V1।"},
{s:"Mixed ও Special",q:"____ I you, I would apologise.",o:["Am", "Was", "Were", "Be"],a:2,e:"Were I you = If I were you।"},
{s:"Mixed ও Special",q:"You can borrow my book ____ you return it tomorrow.",o:["unless", "provided", "although", "lest"],a:1,e:"শর্ত বোঝাতে provided (that)।"},
{s:"Mixed ও Special",q:"But for your help, I ____ failed.",o:["would have", "would", "will have", "had"],a:0,e:"But for = যদি না থাকত; Type 3-এর ফল: would have + V3।"},
{s:"Mixed ও Special",q:"Take an umbrella ____ it rains.",o:["unless", "in case", "though", "until"],a:1,e:"সতর্কতার জন্য in case।"},
{s:"Wish ও As if",q:"I wish I ____ harder last year.",o:["studied", "have studied", "had studied", "would study"],a:2,e:"অতীত অনুতাপে wish + had + V3।"},
{s:"Wish ও As if",q:"She behaves as if she ____ the owner.",o:["is", "were", "will be", "has been"],a:1,e:"as if-এর পর কল্পিত বর্তমানে were।"},
{s:"Wish ও As if",q:"If only I ____ more careful yesterday!",o:["am", "was", "were", "had been"],a:3,e:"অতীত অনুতাপে If only + had + V3।"},
{s:"Wish ও As if",q:"I would rather you ____ here.",o:["stay", "stayed", "will stay", "staying"],a:1,e:"would rather + subject + past।"}
]},
{id:"sent",name:"Sentence",
lessons:[
["Sentence-এর গঠন", "Subject, Predicate ও Pattern", "সম্পূর্ণ ভাব প্রকাশ করে এমন শব্দগুচ্ছ হলো Sentence। এর দুই অংশ: Subject (কে/কী) ও Predicate (কী করছে বা কেমন)।", "শুরুতে capital letter থাকে এবং শেষে (.), (?) বা (!) বসে। প্রতিটি sentence-এ অন্তত একটি finite verb থাকে।", "<b>S + V:</b> Birds <b>fly</b>.|<b>S + V + O:</b> He <b>reads</b> a book.|<b>S + V + C:</b> He is <b>a doctor</b>.|<b>S + V + IO + DO:</b> She gave <b>me</b> <b>a book</b>.|<b>S + V + O + C:</b> They made him <b>captain</b>.", "<b>Imperative-এ subject (you) উহ্য থাকে:</b> (You) Close the door।|<b>Complement</b> subject বা object-এর গুণ বা পরিচয় বলে, আর <b>object</b> কাজের ফল গ্রহণ করে।|<b>Indirect object</b> আগে (কাকে), <b>direct object</b> পরে (কী)।"],
["অর্থ অনুযায়ী", "Assertive, Interrogative, Imperative, Optative, Exclamatory", "অর্থ বা ভাব অনুযায়ী Sentence পাঁচ প্রকার।", "মনে রাখো: বিবৃতি, প্রশ্ন, আদেশ, প্রার্থনা ও আবেগ।", "<b>Assertive:</b> He plays cricket. (Statement)|<b>Interrogative:</b> Do you like tea? (প্রশ্ন, শেষে ?)|<b>Imperative:</b> Close the door. (আদেশ, অনুরোধ, উপদেশ)|<b>Optative:</b> May Allah bless you. (ইচ্ছা, প্রার্থনা, অভিশাপ)|<b>Exclamatory:</b> What a beautiful flower it is! (আবেগ, শেষে !)", "<b>Optative:</b> May + subject + V1; Long live Bangladesh! (এটিও Optative)।|<b>Exclamatory গঠন:</b> What + a + adjective + noun + S + V! / How + adjective/adverb + S + V!।|<b>Let us go</b> (প্রথম পুরুষের আদেশ) Imperative; Let him come-ও Imperative।|<b>Rhetorical question</b> দেখতে প্রশ্ন, অর্থে বিবৃতি: Who does not love his country? = Everybody loves his country।"],
["গঠন অনুযায়ী", "Simple, Compound, Complex", "Clause-এর সংখ্যা ও সংযোগ অনুযায়ী Sentence তিন প্রকার।", "মূল সূত্র: Independent clause (নিজে পূর্ণ অর্থ দেয়) ও Dependent clause (একা অর্থ দেয় না)।", "<b>Simple:</b> একটি independent clause: Walking in the garden, she met a friend.|<b>Compound:</b> দুই বা বেশি independent clause, coordinating conjunction দিয়ে যুক্ত: He is poor, <b>but</b> he is honest.|<b>Complex:</b> একটি independent + এক বা একাধিক dependent clause: <b>Although he is poor</b>, he is honest.", "<b>Coordinating:</b> and, but, or, so, yet, for, nor। <b>Subordinating:</b> although, because, if, when, since, that, who, which।|<b>He came, he saw, he conquered</b> = Compound (তিনটি independent clause)।|<b>Compound-Complex:</b> দুই বা বেশি independent + অন্তত একটি dependent clause।|Participle বা infinitive phrase থাকলেও finite verb একটি হলে Simple।"],
["Clause", "Subject + Finite Verb", "Subject ও finite verb আছে এমন শব্দগুচ্ছকে Clause বলে। একটি Sentence-এ এক বা একাধিক clause থাকতে পারে।", "সূত্র: Clause = Subject + Finite Verb। Finite verb না থাকলে সেটি Phrase।", "<b>Independent (Principal) Clause:</b> একা পূর্ণ অর্থ দেয়: <b>He is honest</b>।|<b>Dependent (Subordinate) Clause:</b> একা পূর্ণ অর্থ দেয় না: <b>although he is poor</b>।|<b>Dependent clause-এর তিন প্রকার:</b> Noun clause, Adjective clause, Adverb clause।|<b>Sentence-এ ভূমিকা:</b> Simple = ১টি independent; Compound = ২+ independent; Complex = independent + dependent।", "<b>চেনার উপায়:</b> শুরুতে that, who, if, when, although-এর মতো শব্দ থাকলে সাধারণত dependent clause।|<b>Dependent clause একা বসলে ভাব অসম্পূর্ণ থাকে:</b> Although he is poor…|<b>তিন প্রশ্ন:</b> ‘কী?’ এর উত্তর = Noun clause; noun-কে বর্ণনা করে = Adjective clause; কখন/কেন/কীভাবে-র উত্তর = Adverb clause।"],
["Noun Clause", "Noun-এর কাজ করে", "যে dependent clause বাক্যে noun-এর কাজ (subject, object, complement বা preposition-এর object) করে।", "চেনার উপায়: verb-কে ‘কী?’ বা ‘কে?’ দিয়ে প্রশ্ন করলে যদি clause-টি উত্তর হয়, সেটি Noun clause।", "<b>Subject:</b> <b>What he said</b> surprised everyone.|<b>Object:</b> I know <b>that he is honest</b>.|<b>Complement:</b> The truth is <b>that he is innocent</b>.|<b>Preposition-এর object:</b> Pay attention to <b>what I say</b>.|<b>শুরু হয়:</b> that, what, whether, if, who, whom, why, how, when, where দিয়ে।", "<b>that বাদ দেওয়া যায়:</b> I know (that) he is honest।|<b>whether ও if</b> ‘কিনা’ অর্থে: She asked <b>whether/if</b> he would come।|<b>Noun clause-এর আগে সাধারণত comma বসে না।</b>|<b>that</b> noun-কে বর্ণনা করলে সেটি Adjective clause, noun clause নয়।"],
["Adjective Clause", "Noun-কে বর্ণনা করে", "যে dependent clause কোনো noun বা pronoun-কে বর্ণনা করে। একে Relative Clause-ও বলে।", "যে noun-কে বর্ণনা করে সেটি Antecedent। Clause শুরু হয় relative pronoun বা relative adverb দিয়ে।", "<b>who / whom:</b> মানুষ: The boy <b>who is standing there</b> is my brother.|<b>whose:</b> মালিকানা: The man <b>whose car was stolen</b> called the police.|<b>which:</b> প্রাণী ও বস্তু: The book <b>which I bought</b> is good.|<b>that:</b> মানুষ, প্রাণী ও বস্তু: The book <b>that I bought</b> is interesting.|<b>where / when / why:</b> This is the house <b>where I was born</b>.", "<b>Defining ও Non-defining:</b> comma ছাড়া হলে defining (অপরিহার্য তথ্য); comma সহ হলে non-defining (বাড়তি তথ্য): My brother, <b>who lives in Dhaka</b>, is a doctor।|<b>Non-defining clause-এ that বসে না।</b>|<b>Preposition-এর পর whom/which:</b> the man <b>to whom</b> I spoke।"],
["Adverb Clause", "কখন, কোথায়, কেন, কীভাবে", "যে dependent clause verb, adjective বা অন্য adverb-কে modify করে।", "আট প্রকার: Time, Place, Reason, Condition, Concession, Purpose, Result ও Manner/Comparison।", "<b>Time:</b> when, while, before, after, as soon as, till: <b>When he came</b>, I left.|<b>Place:</b> where, wherever: Stay <b>where you are</b>.|<b>Reason:</b> because, since, as: I stayed home <b>because I was ill</b>.|<b>Condition:</b> if, unless: <b>If it rains</b>, we will stay.|<b>Concession:</b> although, though, even if: He went out <b>although it was raining</b>.|<b>Purpose:</b> so that, in order that, lest: He studied hard <b>so that he might pass</b>.|<b>Result:</b> so…that, such…that: He was <b>so weak that he could not walk</b>.|<b>Manner/Comparison:</b> as, as if, than: He is taller <b>than I am</b>.", "<b>Adverb clause শুরুতে বসলে পরে comma:</b> When he came, I left।|<b>lest-এর পর should:</b> Work hard lest you <b>should</b> fail।|<b>Although/Though-এর সঙ্গে but বসে না।</b>|<b>since</b> সময় ও কারণ দুটোই বোঝাতে পারে, অর্থ দেখে ঠিক করো।"],
["Phrase", "Finite Verb ছাড়া শব্দগুচ্ছ", "এমন শব্দগুচ্ছ যেখানে subject ও finite verb একসঙ্গে থাকে না। এটি একা পূর্ণ বাক্য হয় না।", "Phrase বাক্যে noun, adjective বা adverb-এর কাজ করে।", "<b>Noun phrase:</b> <b>The old man</b> is wise.|<b>Adjective phrase:</b> A man <b>of honour</b> is respected.|<b>Adverb phrase:</b> We went for a walk <b>in the morning</b>.|<b>Prepositional phrase:</b> <b>on the table</b>, <b>in spite of poverty</b>।|<b>Infinitive phrase:</b> <b>To err</b> is human.|<b>Gerund phrase:</b> <b>Swimming in the river</b> is fun.|<b>Participle phrase:</b> <b>Seeing the tiger</b>, the boy ran away.", "<b>Phrase বনাম Clause:</b> finite verb আছে? আছে = Clause, নেই = Phrase।|<b>Phrase → Clause (Simple → Complex):</b> In spite of his poverty → Although he is poor।|<b>Gerund phrase</b> noun-এর কাজ করে, <b>participle phrase</b> adjective-এর কাজ করে।"],
["Transformation", "Sentence-এর রূপান্তর", "অর্থ না বদলে Sentence-এর গঠন বা প্রকার বদলানোই Transformation।", "মূল কৌশল: phrase থেকে clause (Simple → Complex), আর clause থেকে conjunction দিয়ে আলাদা বাক্য (Complex → Compound)।", "<b>Simple → Complex:</b> In spite of his poverty, he is honest. → <b>Although he is poor</b>, he is honest.|<b>Simple → Complex:</b> Hearing the news, he wept. → <b>When he heard the news</b>, he wept.|<b>Complex → Compound:</b> As he was ill, he could not come. → He was ill, <b>so</b> he could not come.|<b>Assertive → Exclamatory:</b> It is a very beautiful flower. → <b>What a beautiful flower</b> it is!|<b>Too…to → So…that:</b> He is too weak to walk. → He is <b>so weak that he cannot walk</b>.", "<b>Rhetorical question → Assertive:</b> Who does not love his country? → Everybody loves his country।|<b>Although/Though ও but</b> একসঙ্গে বসে না: Compound-এ but/yet, Complex-এ although।|<b>Because/As = so</b> (কারণ ও ফল): Compound-এ ‘so’ ফলের আগে বসে।"]
],

{s:"Sentence-এর গঠন",q:"A sentence must have a subject and a ____.",o:["object", "predicate", "adjective", "phrase"],a:1,e:"প্রতিটি sentence-এর দুই অংশ: Subject ও Predicate।"},
{s:"Sentence-এর গঠন",q:"Birds fly. এর pattern কোনটি?",o:["S + V", "S + V + O", "S + V + C", "S + V + IO + DO"],a:0,e:"শুধু subject ও verb আছে, তাই S + V।"},
{s:"Sentence-এর গঠন",q:"“She gave me a book.” এর pattern কোনটি?",o:["S + V + O", "S + V + C", "S + V + O + C", "S + V + IO + DO"],a:3,e:"me = indirect object, a book = direct object।"},
{s:"Sentence-এর গঠন",q:"“He is a doctor.” এর pattern কোনটি?",o:["S + V", "S + V + O", "S + V + C", "S + V + O + C"],a:2,e:"a doctor subject-এর পরিচয় দিচ্ছে, তাই complement।"},
{s:"অর্থ অনুযায়ী",q:"“Close the window.” কোন ধরনের Sentence?",o:["Assertive", "Interrogative", "Imperative", "Optative"],a:2,e:"আদেশ বা অনুরোধ বোঝাচ্ছে, তাই Imperative।"},
{s:"অর্থ অনুযায়ী",q:"“May Allah bless you.” কোন ধরনের Sentence?",o:["Imperative", "Optative", "Exclamatory", "Assertive"],a:1,e:"প্রার্থনা বা শুভকামনা, তাই Optative।"},
{s:"অর্থ অনুযায়ী",q:"“What a beautiful flower it is!” কোন ধরনের Sentence?",o:["Assertive", "Optative", "Exclamatory", "Interrogative"],a:2,e:"আবেগ প্রকাশ করছে, তাই Exclamatory।"},

const N={"deg": {"lessons": [["Forms ও Rules", "Positive · Comparative · Superlative", "কোনো ব্যক্তি বা বস্তুর গুণের মাত্রা তিন ধাপে প্রকাশ হয়: Positive, Comparative ও Superlative।", "Comparative-এর পর <b>than</b>, Superlative-এর আগে <b>the</b> বসে।", "<b>Positive:</b> He is as tall as I (am).|<b>Comparative:</b> He is taller than I (am).|<b>Superlative:</b> He is the tallest boy in the class.|<b>এক syllable:</b> tall → taller → tallest; <b>-y শব্দ:</b> happy → happier → happiest; <b>লম্বা শব্দ:</b> more/most beautiful।|<b>Irregular:</b> good/well → better → best; bad/ill → worse → worst; much/many → more → most; little → less → least; far → farther/further → farthest/furthest।", "<b>Double comparative ভুল:</b> more better, most unique ✗।|<b>Latin comparative-এর পর to:</b> senior to, junior to, superior to, inferior to, prefer to (than নয়)।|<b>Of the two:</b> She is <b>the taller</b> of the two।|<b>farther</b> = দূরত্ব, <b>further</b> = অতিরিক্ত (further information)। <b>elder/eldest</b> শুধু পরিবারের সদস্যে।|<b>the + comparative … the + comparative:</b> The more, the merrier।"], ["Degree পরিবর্তন", "Superlative ↔ Comparative ↔ Positive", "অর্থ ঠিক রেখে এক degree থেকে অন্য degree-এ রূপান্তর।", "সূত্র: <b>Superlative → Comparative:</b> than any other + singular noun; <b>→ Positive:</b> No other + singular noun + is as + positive + as।", "<b>Superlative:</b> He is the tallest boy in the class.|<b>Comparative:</b> He is taller than <b>any other</b> boy in the class.|<b>Positive:</b> <b>No other</b> boy in the class is as tall as he.|<b>Comparative → Positive:</b> He is taller than I → I am not as tall as he।", "<b>any other</b> বসে একই দলের মধ্যে তুলনায়: than any other boy ✓, than any boy ✗।|<b>Negative positive:</b> not as/so…as।|<b>than-এর পর</b> পরীক্ষার শুদ্ধ রূপ: taller than <b>I</b> (am)।"]], "mcqs": [{"s": "Forms ও Rules", "q": "He is senior ____ me.", "o": ["than", "to", "from", "with"], "a": 1, "e": "Latin comparative (senior, junior, superior)-এর পর to বসে।"}, {"s": "Forms ও Rules", "q": "She is the ____ of the two sisters.", "o": ["tallest", "taller", "more tall", "most tall"], "a": 1, "e": "দুজনের মধ্যে the + comparative।"}, {"s": "Forms ও Rules", "q": "কোনটি শুদ্ধ?", "o": ["This is more better.", "This is better.", "This is most best.", "This is more good."], "a": 1, "e": "better নিজেই comparative, আগে more বসে না।"}, {"s": "Forms ও Rules", "q": "‘অতিরিক্ত’ অর্থে কোনটি বসে? “Do you need ____ information?”", "o": ["farther", "further", "farer", "farrer"], "a": 1, "e": "অতিরিক্ত অর্থে further।"}, {"s": "Degree পরিবর্তন", "q": "He is the tallest boy in the class. = He is taller than ____ boy in the class.", "o": ["any", "other", "any other", "all other"], "a": 2, "e": "একই দলের মধ্যে তুলনায় any other।"}, {"s": "Degree পরিবর্তন", "q": "Iron is the most useful of all metals. = Iron is more useful than ____.", "o": ["any metal", "any other metal", "other metals", "all metals"], "a": 1, "e": "Comparative-এ than any other + singular noun।"}]}, "voice": {"lessons": [["Tense অনুযায়ী Passive", "Active → Passive-এর সূত্র", "Active-এ কর্তা কাজ করে; Passive-এ কাজের ফল (object) subject হয়।", "সূত্র: <b>Object → Subject + be (tense অনুযায়ী) + V3 + by + Agent</b>।", "<b>Present simple:</b> A letter <b>is written</b> by him.|<b>Past simple:</b> A letter <b>was written</b> by him.|<b>Future:</b> A letter <b>will be written</b> by him.|<b>Present continuous:</b> A letter <b>is being written</b> by him.|<b>Present perfect:</b> A letter <b>has been written</b> by him.|<b>Modal:</b> It <b>can be done</b> by you.", "<b>Pronoun বদলায়:</b> I→me, we→us, he→him, she→her, they→them।|<b>Intransitive ও stative verb (have, resemble, lack, suit)-এর Passive হয় না।</b>|<b>Continuous passive:</b> The house <b>is being built</b> (is building ✗)।|<b>দুই object:</b> She gave me a book → I was given a book (বা A book was given to me)।"], ["Special Cases", "প্রশ্ন, আদেশ ও Preposition", "প্রশ্ন, আদেশ ও ভিন্ন preposition নেওয়া Passive-এর বিশেষ নিয়ম।", "<b>agent অজানা বা অপ্রয়োজনীয়</b> হলে by-অংশ বাদ যায়।", "<b>Yes/No:</b> Did he write it? → <b>Was</b> it written by him?|<b>WH:</b> Who wrote it? → <b>By whom</b> was it written?|<b>Imperative:</b> Close the door. → <b>Let the door be closed</b>.|<b>Impersonal:</b> People say he is honest → <b>It is said</b> that he is honest / He is said to be honest.", "<b>by-এর বদলে:</b> known <b>to</b>, surprised <b>at</b>, pleased/satisfied <b>with</b>, interested <b>in</b>, filled/covered <b>with</b>, married <b>to</b>।|<b>get + V3</b> informal passive: get married, get hurt।|<b>be-verb</b> subject অনুযায়ী (is/are, was/were) বসে।"]], "mcqs": [{"s": "Tense অনুযায়ী Passive", "q": "A letter ____ by him every day.", "o": ["writes", "is written", "was written", "has written"], "a": 1, "e": "Present simple passive: is/am/are + V3।"}, {"s": "Tense অনুযায়ী Passive", "q": "The house ____ now.", "o": ["is building", "is being built", "has built", "was built"], "a": 1, "e": "Present continuous passive: is being + V3।"}, {"s": "Tense অনুযায়ী Passive", "q": "The work must ____ today.", "o": ["done", "be done", "is done", "been done"], "a": 1, "e": "Modal passive: modal + be + V3।"}, {"s": "Tense অনুযায়ী Passive", "q": "“She has finished the work.” এর Passive—", "o": ["The work is finished by her.", "The work has been finished by her.", "The work was finished by her.", "The work had been finished by her."], "a": 1, "e": "Present perfect passive: has/have been + V3।"}, {"s": "Special Cases", "q": "“Who wrote the letter?” এর Passive—", "o": ["Whom was the letter written by?", "By whom was the letter written?", "Who was the letter written by?", "Who is the letter written?"], "a": 1, "e": "WH subject প্রশ্নের Passive: By whom + was + object + V3।"}, {"s": "Special Cases", "q": "He is known ____ everyone.", "o": ["by", "to", "with", "for"], "a": 1, "e": "known to (by নয়)।"}, {"s": "Special Cases", "q": "“Close the door.” এর Passive—", "o": ["The door be closed.", "Let the door be closed.", "The door is closed.", "Let the door closed."], "a": 1, "e": "Imperative-এর Passive: Let + object + be + V3।"}, {"s": "Special Cases", "q": "কোন verb-এর Passive হয় না?", "o": ["write", "resemble", "build", "make"], "a": 1, "e": "resemble stative verb, তাই Passive হয় না।"}]}, "par": {"lessons": [["Parallel Structure", "একই রূপ, একই ছক", "And, or, but বা জোড়া conjunction দিয়ে যুক্ত অংশগুলো একই grammatical রূপে (noun-noun, V-ing–V-ing, to V–to V, adjective–adjective, clause–clause) থাকতে হবে।", "<b>Both…and, Either…or, Neither…nor, Not only…but also, Whether…or:</b> দুই পাশে একই ধরনের শব্দ বসাও।", "<b>V-ing:</b> She likes <b>swimming, reading and dancing</b> (to dance ✗).|<b>Adjective:</b> He is not only <b>intelligent</b> but also <b>hardworking</b>.|<b>Infinitive:</b> He wants <b>to read</b> and <b>to write</b>.|<b>Clause:</b> He said <b>that he was ill</b> and <b>that he could not come</b>.", "<b>তুলনায় সমান জিনিস:</b> The climate of Dhaka is hotter than <b>that of</b> Sylhet (than Sylhet ✗)।|<b>Correlative-এর জায়গা:</b> He goes <b>either to</b> the market <b>or to</b> the school (Either goes… ✗)।|<b>Preposition মিলাও:</b> interested <b>in</b> and fond <b>of</b> music (interested and fond of ✗)।|<b>Tense মিলাও:</b> He came and <b>said</b> (came and says ✗)।|<b>Either…or / Neither…nor</b>-এ verb কাছের subject অনুযায়ী, <b>Both…and</b>-এর পর plural verb।"]], "mcqs": [{"s": "Parallel Structure", "q": "She likes swimming, reading and ____.", "o": ["to dance", "dance", "dancing", "danced"], "a": 2, "e": "V-ing, V-ing ও V-ing-এর সমান রূপ।"}, {"s": "Parallel Structure", "q": "The climate of Dhaka is hotter than ____ of Sylhet.", "o": ["those", "that", "it", "this"], "a": 1, "e": "জলবায়ুর সঙ্গে জলবায়ুর তুলনা, তাই that of।"}, {"s": "Parallel Structure", "q": "He is not only intelligent but also ____.", "o": ["works hard", "hardworking", "hard work", "to work hard"], "a": 1, "e": "Adjective-এর সঙ্গে adjective।"}, {"s": "Parallel Structure", "q": "He is interested ____ and fond of music.", "o": ["of", "on", "in", "at"], "a": 2, "e": "interested in ও fond of—দুই preposition আলাদা মিলাতে হয়।"}, {"s": "Parallel Structure", "q": "He neither came ____ wrote.", "o": ["or", "nor", "and", "but"], "a": 1, "e": "neither-এর জোড়া nor।"}]}, "inv": {"lessons": [["Inversion গঠন", "Aux + Subject", "কিছু শব্দ বা বাক্যাংশ বাক্যের শুরুতে বসলে auxiliary verb subject-এর আগে চলে আসে।", "গঠন: <b>Fronted word + Auxiliary + Subject + Main verb</b>।", "<b>Never/Rarely/Seldom/Little:</b> <b>Seldom do</b> we see such honesty.|<b>No sooner…than:</b> <b>No sooner had</b> he arrived <b>than</b> it began to rain.|<b>Hardly/Scarcely…when:</b> <b>Hardly had</b> he arrived <b>when</b> it began to rain.|<b>Not only…but also:</b> <b>Not only did</b> he pass, but he also won a prize.|<b>Only + adverbial:</b> <b>Only then did</b> I realise my mistake.|<b>So + adjective:</b> <b>So great was</b> his anger that he left.", "<b>No sooner…than</b> (when নয়); <b>Hardly/Scarcely…when</b> (than নয়)।|<b>Not until</b>-এর inversion main clause-এ: Not until he came <b>did I know</b>।|<b>Inversion-এর পর</b> verb subject অনুযায়ী হয়।|<b>Here/There + verb:</b> Here comes the bus; pronoun হলে inversion নেই: Here he comes।|<b>Conditional inversion:</b> Had I known / Were I you / Should you need।"]], "mcqs": [{"s": "Inversion গঠন", "q": "No sooner had he arrived ____ it began to rain.", "o": ["when", "than", "then", "as"], "a": 1, "e": "No sooner-এর জোড়া than।"}, {"s": "Inversion গঠন", "q": "Hardly had he reached the station ____ the train left.", "o": ["than", "when", "then", "but"], "a": 1, "e": "Hardly-এর জোড়া when।"}, {"s": "Inversion গঠন", "q": "Seldom ____ such honesty.", "o": ["we see", "we do see", "do we see", "did we saw"], "a": 2, "e": "Seldom শুরুতে বসলে do + subject + V1।"}, {"s": "Inversion গঠন", "q": "Not only ____ the exam, but he also won a prize.", "o": ["he passed", "he did pass", "did he pass", "has he passed"], "a": 2, "e": "Not only শুরুতে বসলে did h too"], "a": 1, "e": "Negative-এ neither + auxiliary + subject।"}]}, "subj": {"lessons": [["Subjunctive গঠন", "that-clause-এ Base Verb", "প্রস্তাব, দাবি, উপদেশ, আদেশ ও প্রয়োজনীয়তা বোঝাতে that-clause-এ subject-এর পর verb-এর মূল রূপ (V1) বসে।", "<b>suggest, recommend, insist, demand, request, propose, advise, order + that + subject + V1</b>; <b>It is essential/necessary/important/vital + that + subject + V1</b>।", "The doctor recommended that she <b>take</b> rest.|I insist that he <b>come</b> on time.|It is essential that every student <b>be</b> present.|He demanded that the work <b>be done</b> at once.|Long <b>live</b> Bangladesh! (শুভকামনা)", "<b>V1-এ s/es বসে না:</b> He suggested that she <b>leave</b> (leaves ✗)।|<b>be:</b> It is vital that he <b>be</b> careful (is/was ✗)।|<b>Negative:</b> subject + <b>not</b> + V1: He suggested that she <b>not go</b>।|<b>insist যখন দৃঢ় বিশ্বাস:</b> He insisted that he <b>was</b> innocent (এখানে Subjunctive নয়)।|<b>Main verb past হলেও</b> that-clause-এ V1: He demanded that she <b>leave</b> (left ✗)।"]], "mcqs": [{"s": "Subjunctive গঠন", "q": "The doctor recommended that she ____ rest.", "o": ["takes", "took", "take", "is taking"], "a": 2, "e": "recommend-এর that-clause-এ V1।"}, {"s": "Subjunctive গঠন", "q": "It is essential that every student ____ present.", "o": ["is", "be", "are", "was"], "a": 1, "e": "It is essential that-এর পর be।"}, {"s": "Subjunctive গঠন", "q": "I insist that he ____ on time.", "o": ["comes", "came", "come", "will come"], "a": 2, "e": "insist (দাবি)-এর পর V1।"}, {"s": "Subjunctive গঠন", "q": "He demanded that she ____ the room at once.", "o": ["leaves", "left", "leave", "has left"], "a": 2, "e": "demand-এর পর V1, main verb past হলেও।"}, {"s": "Subjunctive গঠন", "q": "He suggested that the meeting ____ postponed.", "o": ["is", "was", "be", "been"], "a": 2, "e": "Passive-এ be + V3।"}]}, "tag": {"lessons": [["Tag Question গঠন", "Positive ↔ Negative", "বাক্যের শেষে ছোট প্রশ্ন (tag) যোগ করে সমর্থন বা নিশ্চিত হও , how) দিয়ে শুরু প্রশ্ন Direct; অন্য বাক্যের ভেতরে বসা প্রশ্ন Embedded (Indirect)।", "<b>Direct:</b> WH + aux + subject + verb। <b>Embedded:</b> WH + subject + verb (বিবৃতির ক্রম)।", "<b>Direct:</b> <b>Where does</b> he live?|<b>Embedded:</b> I don’t know <b>where he lives</b>.|<b>প্রশ্নের ভেতরে:</b> Do you know <b>what time it is</b>?|<b>Yes/No → if/whether:</b> I wonder <b>whether he will come</b>.|<b>Subject WH:</b> <b>Who broke</b> the window?", "<b>Embedded-এ do/does/did বসে না:</b> Do you know where does he live? ✗ → where <b>he lives</b>।|<b>Subject আগে, verb পরে:</b> what his name <b>was</b> (what was his name ✗)।|<b>Question mark:</b> মূল বাক্য বিবৃতি হলে (.), মূল বাক্য প্রশ্ন হলে (?)।|<b>Subject-WH-এ do বসে না:</b> Who did break ✗।|<b>who</b> (subject), <b>whom</b> (object): Whom did you see?|<b>Common শুরু:</b> Could you tell me…, Do you know…, I wonder…, I don’t know…।"]], "mcqs": [{"s": "WH ও Embedded Question", "q": "Do you know where ____?", "o": ["does he live", "he lives", "he live", "lives he"], "a": 1, "e": "Embedded প্রশ্নে বিবৃতির ক্রম।"}, {"s": "WH ও Embedded Question", "q": "I don’t know what ____.", "o": ["is his name", "his name is", "his name does", "his name be"], "a": 1, "e": "Embedded প্রশ্নে subject আগে, verb পরে।"}, {"s": "WH ও Embedded Question", "q": "____ broke the window?", "o": ["Whom", "Who", "Whose", "What"], "a": 1, "e": "Subject প্রশ্নে who।"}, {"s": "WH ও Embedded Question", "q": "Could you tell me ____?", "o": ["where is the post office", "where the post office is", "where does the post office", "the post office where is"], "a": 1, "e": "Embedded প্রশ্নে বিবৃতির ক্রম।"}, {"s": "WH ও Embedded Question", "q": "I wonder ____ he will come.", "o": ["that", "whether", "which", "what"], "a": 1, "e": "Yes/No অর্থে whether বা if।"}, {"s": "WH ও Embedded Question", "q": "____ did you see yesterday?", "o": ["Whom", "Who is", "Whose", "Which is"], "a": 0, "e": "Object প্রশ্নে whom।"}]}, "posn": {"lessons": [["Position of Parts of Speec const pk=(id,n)=>({lessons:n.map(x=>O[id].lessons.find(l=>l[0]===x)).filter(Boolean),mcqs:O[id].mcqs.filter(q=>n.includes(q.s))});
const nm=n=>O.pos.lessons.map(l=>l[0]).filter(x=>x!=="Tricky Cases");
const FULL={"deg": "Degree of Comparison", "voice": "Voice (Active & Passive)", "cond": "Conditional Sentence", "par": "Parallelism & Structure Agreement", "inv": "Inversion of Verb", "sva": "Subject-Verb Agreement", "rfv": "Right Form of Verbs", "neg": "Affirmative & Negative Agreement", "subj": "Present Subjunctive", "tag": "Tag Questions", "wh": "WH Question & Embedded Question", "pos": "Identification & Position of Parts of Speech", "same": "Same Word as Different Parts of Speech", "pc": "Identification of Phrase & Clause", "scc": "Simple, Complex, Compound Sentence"};
const mk=(id,name,bn,d)=>({id,name,full:FULL[id],bn,lessons:d.lessons,mcqs:d.mcqs});
const POS={lessons:[...O.pos.lessons.filter(l=>l[0]!=="Tricky Cases"),...N.posn.lessons],mcqs:[...O.pos.mcqs.filter(q=>q.s!=="Tricky Cases"&&!q.q.includes("light")),...N.posn.mcqs]};
const SAME={lessons:[O.pos.lessons.find(l=>l[0]==="Tricky Cases"),...N.same.lessons],mcqs:[...O.pos.mcqs.filter(q=>q.s==="Tricky Cases"||q.q.includes("light")).map(q=>q.s?q:{...q,s:"Tricky Cases"}),...N.same.mcqs]};
const SENT=["Sentence-এর গঠন","অর্থ অনুযায়ী","গঠন অনুযায়ী","Transformation"];
const RFV=["Tense ও Verb Form","Gerund","Participle","Infinitive","কোনটি কখন?","Special Structures"];
const TOPICS=[
mk("deg","Degree","তুলনার মাত্রা",N.deg),
mk("voice","Voice","বাচ্য পরিবর্তন",N.voice),
mk("cond","Conditional","শর্তমূলক বাক্য",O.cond),
mk("par","Parallelism","গঠনের সামঞ্জস্য",N.par),
mk("inv","Inversion","Verb-এর উল্টো ক্রম",N.inv),
mk("sva","Subject-Verb","কর্তা-ক্রিয়ার মিল",pk("rfv",["Subject–Verb Agreement"])),
mk("rfv","Right Form","Verb-এর শুদ্ধ রূপ",pk("rfv",RFV)),
mk("neg","Agreement","So / Neither গঠন",N.neg),
mk("subj","Subjunctive","প্রস্তাব ও দাবির Verb",N.subj),
mk("tag","Tag Question","বাক্যশেষের প্রশ্ন",N.tag),
mk("wh","WH Question","প্রশ্নবাচক গঠন",N.wh),
mk("pos","Parts of Speech","Parts of Speech চেনা ও অবস্থান",POS),
mk("same","Same Word","একই শব্দ, ভিন্ন রূপ",SAME),
mk("pc","Phrase & Clause","Phrase ও Clause চেনা",pk("sent",["Clause","Noun Clause","Adjective Clause","Adverb Clause","Phrase"])),
mk("scc","Sentence","বাক্যের গঠনভেদ",pk("sent",SENT))
];
let T=null,Q=[],qi=0,sc=0,log=[];
function shuf(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function home(){$("home").innerHTML='<div class="pills">'+TOPICS.map((t,i)=>`<button class="pill${t===T?" on":""}" data-i="${i}">${t.name}<em>${t.mcqs.length}</em></button>`).join("")+"</div>";$("home").querySelectorAll(".pill").forEach(b=>b.onclick=()=>openT(TOPICS[+b.dataset.i]));const a=$("home").querySelector(".pill.on");if(a)a.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"})}
function openT(t){T=t;$("topic").hidden=false;$("tt").textContent=t.full;home();tab("lesson")}
function tab(t){$("tL").classList.toggle("on",t==="lesson");$("tQ").classList.toggle("on",t==="quiz");$("lesson").hidden=t!=="lesson";$("quiz").hidden=t!=="quiz";t==="lesson"?lesson():intro()}
function lesson(){$("lesson").innerHTML=T.lessons.map((l,i)=>`<details class="lc"${i?"":" open"}><summary>${l[0]}<small>${l[1]}</small></summary><div class="in"><p>${l[2]}</p><div class="note">${l[3]}</div><ul>${l[4].split("|").map(e=>"<li>"+e+"</li>").join("")}</ul>${l[5]?`<div class="tricky"><b>⚠ ভর্তি পরীক্ষার ট্র্যাপ</b><ul>${l[5].split("|").map(e=>"<li>"+e+"</li>").join("")}</ul></div>`:""}${bq(l[0])}</div></details>`).join("")}
function bq(n){const a=T.mcqs.filter(q=>q.s===n);return a.length?`<div class="tricky"><b>এই অংশের প্রশ্ন (${a.length})</b>${a.map(q=>`<details class="bq"><summary>${q.q} ${q.b?"<small>["+q.b+"]</small>":""}</summary><p>${q.o.map((o,i)=>"ABCD"[i]+". "+o).join("<br>")}</p><p><b>উত্তর: ${"ABCD"[q.a]}. ${q.o[q.a]}</b>। ${q.e}</p></details>`).join("")}</div>`:""}
function best(){try{return localStorage.getItem("acadex-grammar-best-"+T.id)}catch(e){return null}}
function intro(){const b=best();$("quiz").innerHTML=`<div class="box center"><h2>${T.name}: Practice Test</h2><p>${Math.min(10,T.mcqs.length)}টি MCQ, প্রতিবার ${T.mcqs.length}টির প্রশ্নভান্ডার থেকে এলোমেলোভাবে। প্রতিটি উত্তর দেওয়ার সঙ্গে সঙ্গেই সঠিক উত্তর ও ব্যাখ্যা দেখতে পাবে।</p>${b?`<p class="dim">তোমার সর্বোচ্চ স্কোর: ${b}/${Math.min(10,T.mcqs.length)}</p>`:""}<button class="btn go" id="go">Start Practicing<span>→</span></button></div>`;$("go").onclick=start}
function start(){Q=shuf(T.mcqs).slice(0,10).map(q=>{const ix=shuf(q.o.map((_,i)=>i));return{...q,o:ix.map(i=>q.o[i]),a:ix.indexOf(q.a)}});qi=0;sc=0;log=[];ask()}
function ask(){const x=Q[qi];$("quiz").innerHTML=`<div class="box"><div class="bar"><span style="width:${qi/Q.length*100}%"></span></div><div class="meta"><span>প্রশ্ন ${qi+1}/${Q.length}</span><span>স্কোর ${sc}</span></div><p class="q">${x.q}</p><div id="opts"></div><div class="fb" id="fb" hidden></div><button class="btn" id="nx" hidden></button></div>`;
 x.o.forEach((o,i)=>{const b=document.createElement("button");b.className="opt";b.textContent="ABCD"[i]+". "+o;b.onclick=()=>pick(i);$("opts").appendChild(b)})}
function pick(i){const x=Q[qi],k=[...$("opts").children],ok=i===x.a;k.forEach(b=>b.disabled=true);k[x.a].classList.add("ok");if(!ok)k[i].classList.add("bad");if(ok)sc++;else log.push({q:x.q,y:x.o[i],c:x.o[x.a],e:x.e});
 const f=$("fb");f.hidden=false;f.innerHTML=(ok?"✅ সঠিক! ":"❌ ভুল। সঠিক উত্তর: <b>"+x.o[x.a]+"</b>। ")+x.e;const n=$("nx");n.hidden=false;n.textContent=qi===Q.length-1?"ফলাফল দেখো":"পরের প্রশ্ন";n.onclick=()=>{qi++;qi<Q.length?ask():done()}}
function done(){const n=Q.length,p=sc/n;try{if(sc>(+best()||0))localStorage.setItem("acadex-grammar-best-"+T.id,sc)}catch(e){}
 const m=p===1?"চমৎকার! সবগুলো সঠিক।":p>=.8?"খুব ভালো! আর একটু অনুশীলনেই পারফেক্ট।":p>=.5?"ভালো চেষ্টা। নিচের ভুলগুলো একবার দেখে নাও।":"পাঠ অংশটি আরেকবার পড়ে আবার চেষ্টা করো।";
 $("quiz").innerHTML=`<div class="box center"><div class="dim">তোমার স্কোর</div><div class="score">${sc}/${n}</div><p>${m}</p></div>`+
 (log.length?`<div class="box" style="margin-top:12px"><h2>ভুল উত্তরের রিভিউ (${log.length})</h2>${log.map(r=>`<div class="rv"><p>${r.q}</p><p class="y">তোমার উত্তর: ${r.y}</p><p class="c">সঠিক উত্তর: ${r.c}</p><p class="dim">${r.e}</p></div>`).join("")}</div>`:"")+
 `<button class="btn" id="again">আবার পরীক্ষা দাও</button><button class="btn alt" id="rl">পাঠ আবার পড়ো</button>`;
 $("again").onclick=start;$("rl").onclick=()=>tab("lesson")}
$("tL").onclick=()=>tab("lesson");$("tQ").onclick=()=>tab("quiz");
openT(TOPICS[0]);
</script>
</body>
</html>

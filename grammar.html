<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a1a2f">
<title>ACADEX English Grammar Hub</title>
<style>
:root{--navy:#0a1a2f;--navy2:#12304f;--card:#0f2640;--line:#2a4766;--gold:#d4af37;--gold2:#f0d98a;--text:#eef2f7;--dim:#9fb0c3;--ok:#22c55e;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;background:radial-gradient(circle at 50% -10%,#1b4a78,var(--navy) 55%);color:var(--text);line-height:1.7}
.wrap{max-width:680px;margin:auto;padding:14px 16px 40px}
header{text-align:center;padding:12px 0 6px}
.home{display:inline-block;color:var(--gold2);font-size:13px;text-decoration:none;margin-bottom:8px}
.brand{font:700 13px Georgia,serif;letter-spacing:.3em;color:var(--gold)}
h1{margin:4px 0 2px;font:700 28px/1.2 Georgia,"Times New Roman",serif;color:#fff}
.sub{margin:0;color:var(--dim);font-size:13px}
.rule-gold{height:2px;width:90px;margin:12px auto 4px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none}
.chip{flex:none;padding:9px 15px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:13px}
.chip.on{background:var(--gold);border-color:var(--gold);color:#241a00;font-weight:700}
.chip:disabled{opacity:.45}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{padding:12px;background:none;border:0;border-bottom:3px solid transparent;color:var(--dim);font:inherit;font-weight:700;font-size:15px}
.tabs button.on{color:var(--gold2);border-bottom-color:var(--gold)}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
/* lessons */
.lc{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.lc summary{cursor:pointer;padding:14px 16px;font:700 17px Georgia,serif;list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lc summary::-webkit-details-marker{display:none}
.lc summary small{font:500 14px "Noto Sans Bengali",system-ui,sans-serif;color:var(--gold2)}
.lc[open] summary{border-bottom:1px solid var(--line);background:#12304f}
.lc .in{padding:12px 16px 16px}
.lc p{margin:0 0 10px}
.tricky{margin-top:14px;padding:12px 14px;border:1px dashed var(--gold);border-radius:10px;background:#0a1a2f;font-size:14px}.tricky ul{margin:8px 0 0}
.lc .bq{border-top:1px solid var(--line);padding:8px 0}.lc .bq summary{display:block;padding:0;border:0;background:none;font:500 14px "Noto Sans Bengali",system-ui,sans-serif}.lc .bq summary small{color:var(--gold2)}.lc .bq p{margin:6px 0 0;font-size:14px}
.note{border-left:3px solid var(--gold);background:#0a1a2f;padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px;color:#dbe4ee}
.lc ul{margin:12px 0 0;padding-left:20px;font-size:15px}
.lc li{margin-bottom:4px}
b{color:var(--gold2)}
u{text-decoration-color:var(--gold);text-underline-offset:3px;text-decoration-thickness:2px}
/* quiz */
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.center{text-align:center}
.box h2{margin:0 0 8px;font:700 21px Georgia,serif}
.btn{display:block;width:100%;margin-top:14px;padding:14px;border:0;border-radius:10px;background:var(--gold);color:#241a00;font:inherit;font-weight:800;font-size:16px}
.btn.alt{background:transparent;border:1px solid var(--gold);color:var(--gold2)}
.bar{height:6px;background:#1c3a59;border-radius:9px;overflow:hidden;margin-bottom:6px}
.bar span{display:block;height:100%;background:var(--gold);transition:width .25s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-bottom:12px}
.q{font-size:18px;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;margin-bottom:9px;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:#0a1a2f;color:var(--text);font:inherit;font-size:16px}
.opt:disabled{opacity:1}
.opt.ok{border-color:var(--ok);background:#0f3a26}
.opt.bad{border-color:var(--bad);background:#401a1a}
.fb{margin-top:6px;padding:12px 14px;border-radius:10px;background:#0a1a2f;border:1px solid var(--line);font-size:15px}
.score{font:700 46px Georgia,serif;color:var(--gold);margin:6px 0}
.rv{padding:14px 0;border-top:1px solid var(--line);font-size:15px}
.rv .y{color:var(--bad)}.rv .c{color:var(--ok)}
.rv p{margin:4px 0}
.dim{color:var(--dim);font-size:14px}
footer{text-align:center;color:var(--dim);font-size:12px;margin-top:26px}
@media(prefers-reduced-motion:reduce){.bar span{transition:none}}
</style>
</head>

<script>
const $=id=>document.getElementById(id);
/* ===== টপিক ডেটা: নতুন টপিক যোগ করতে TOPICS-এ একই কাঠামোর একটি অবজেক্ট দিলেই হবে ===== */
const TOPICS=[
{id:"pos",name:"Parts of Speech",
lessons:[
["Noun","বিশেষ্য","কোনো ব্যক্তি, বস্তু, স্থান বা ভাবের নামকে Noun বলে।","Common, Proper, Collective, Material ও Abstract—এই পাঁচ প্রকার। Proper noun-এর প্রথম অক্ষর সবসময় বড় হাতের হয়।","<b>Dhaka</b> is a big city.|<b>Honesty</b> is the best policy.","<b>information, advice, furniture, luggage, news</b> Uncountable—এদের আগে a/an বসে না, শেষে -s হয় না: <b>much information</b> (informations ভুল)।|<b>news, mathematics, physics, economics</b> দেখতে plural, কিন্তু singular verb নেয়: News <b>is</b> good।|Collective noun পুরো দল হিসেবে বোঝালে singular verb নেয়: The committee <b>has</b> decided।|Noun মাঝে মাঝে adjective-এর কাজ করে: <b>school</b> bus, <b>stone</b> wall।|<b>two-taka note, ninety-year-old woman</b>: সংখ্যাযুক্ত compound বিশেষণে noun singular থাকে (two-takas ভুল)।|টাকা, দূরত্ব, ওজনের পরিমাণ এক একক ধরলে singular verb: One hundred taka <b>is</b> a good sum।|<b>Common Gender:</b> neighbour, sibling, orphan, sovereign পুরুষ বা নারী দুই-ই হতে পারে।|Plural: <b>sheep, fish, aircraft</b> একই থাকে; <b>ovum → ova, louse → lice, criterion → criteria</b>।|প্রতিশ্রুতি অর্থে <b>word</b>: Be true to your <b>word</b>।"],
["Pronoun","সর্বনাম","Noun-এর বদলে যে শব্দ বসে, তাকে Pronoun বলে। এতে একই noun বারবার লিখতে হয় না।","Pronoun-এর রূপ বদলায়: I (subject), me (object), mine (possessive pronoun)। Preposition-এর পর object form বসে।","<b>She</b> helped Rina, so <b>she</b> thanked her.|Give it to <b>me</b>.","<b>who</b> subject-এর জায়গায়, <b>whom</b> object-এর জায়গায়: Whom did you see?|<b>its</b> = তার (possessive), <b>it’s</b> = it is। দুটি গুলিয়ে ফেলা খুব সাধারণ ভুল।|<b>everyone, anyone, nobody, each</b> singular verb নেয়: Everyone <b>is</b> present।|Preposition-এর পর object form: between you and <b>me</b> (between you and I ভুল)।|<b>Let</b>-এর পর object form বসে: Let <b>you and him</b> be witnesses।|দ্বিতীয়বার noun না লিখে possessive pronoun দাও: My bike is faster than <b>yours</b>।|<b>Each of / Every one of</b>-এর পর singular: Each of the sons followed <b>his</b> father’s trade।|<b>whose</b> মালিকানা বোঝায়: a room <b>whose</b> windows were closed।|Verb-এর কর্তা দরকার হলে subject form: Tell me <b>who</b> told you that।"],
["Verb","ক্রিয়া","কাজ করা বা অবস্থা বোঝাতে যে শব্দ বসে, তাকে Verb বলে।","Subject-এর person ও number অনুযায়ী verb বসে: He <b>goes</b>, They <b>go</b>। Tense-ও verb দিয়েই বোঝা যায়।","She <b>sings</b> well.|They <b>are</b> students.","<b>Transitive</b> verb-এর object লাগে: He opened the door। <b>Intransitive</b>-এর লাগে না: The door opened।|<b>look, seem, become, feel</b> linking verb হিসেবে ব্যবহৃত হলে পরে adjective বসে: She looks <b>beautiful</b>। তবে feel/smell/taste কাজ বোঝালে adverb-ও হতে পারে: He felt the fabric <b>carefully</b>।|একই verb Auxiliary ও Main দুটোই হতে পারে: She <b>is</b> reading (auxiliary), She <b>is</b> a doctor (main)।"],
["Adjective","বিশেষণ","Noun বা pronoun-এর গুণ, সংখ্যা বা অবস্থা বোঝায়।","Adjective সাধারণত noun-এর আগে বসে অথবা linking verb (is, am, are, seems)-এর পরে বসে।","She is an <b>intelligent</b> girl.|I have <b>three</b> pens.","Adjective-এর ক্রম: মতামত → আকার → বয়স → রং → দেশ → উপাদান: a lovely small old red Persian wool carpet।|<b>few</b> = প্রায় নেই (নেতিবাচক), <b>a few</b> = অল্প কিছু আছে (ইতিবাচক)। <b>little</b> ও <b>a little</b>-ও একইভাবে।|Double comparative ভুল: more better, more taller। শুদ্ধ: <b>better, taller</b>।|<b>a little</b> uncountable-এর সঙ্গে (a little money), <b>a few</b> countable-এর সঙ্গে (a few friends)।|<b>Determiner</b> noun-এর আগে বসে: a, the, some, any, much, many—Will it take <b>much</b> time? আধুনিক grammar-এ Determiner-কে আলাদা word class ধরা হয়; প্রচলিত ৮ Parts of Speech-এর তালিকায় এগুলোকে প্রায়ই adjective-এর সঙ্গে শেখানো হয়।|<b>above</b> noun-এর আগে বসলে adjective: the <b>above</b> address।"],
["Article","আর্টিকেল","a, an, the—noun-এর আগে বসে noun-কে অনির্দিষ্ট বা নির্দিষ্ট করে।","a/an অনির্দিষ্ট (যে-কোনো একটি), the নির্দিষ্ট (জানা বা আগে বলা)। স্বরধ্বনির উচ্চারণ দিয়ে শুরু শব্দের আগে an বসে।","I saw <b>a</b> boy. <b>The</b> boy was crying.|<b>an</b> hour, <b>a</b> university","<b>the + জাতীয়তা</b> = সেই দেশের মানুষ: She speaks English like <b>the</b> English।|ভাষার নামের আগে the বসে না: She speaks <b>English</b>।"],
["Adverb","ক্রিয়াবিশেষণ","Verb, adjective বা অন্য adverb-কে modify করে—কীভাবে, কখন, কোথায়, কতটা তা জানায়।","Adjective-এর শেষে -ly যোগ করে অনেক adverb হয় (quick → quickly)। কিন্তু সব -ly শব্দ adverb নয়: friendly, lovely হলো adjective।","He walked <b>slowly</b>.|The tea is <b>very</b> hot.","Linking verb যখন subject-এর অবস্থা/গুণ বোঝায়, তখন adjective বসে: She looks <b>beautiful</b>। কিন্তু action বোঝালে adverb হতে পারে।|<b>good</b> adjective, <b>well</b> adverb: He plays <b>well</b>।|দুই অর্থ: <b>hard</b> (কঠোরভাবে) ও <b>hardly</b> (প্রায় না); <b>late</b> (দেরিতে) ও <b>lately</b> (সম্প্রতি)।|<b>fast, early, late, hard</b> adjective ও adverb দুটোর রূপই এক।|<b>some time</b> (কিছু সময়), <b>sometime</b> (কোনো এক সময়), <b>sometimes</b> (মাঝে মাঝে): I spent <b>some time</b> with the patient।|<b>leisurely, cowardly, friendly</b>-এর শেষে -ly থাকলেও এরা adjective: a leisurely stroll।"],
["Preposition","পদান্বয়ী অব্যয়","Noun বা pronoun-এর আগে বসে অন্য শব্দের সঙ্গে তার সম্পর্ক (স্থান, সময়, দিক) বোঝায়।","Preposition-এর পর pronoun থাকলে object form বসে: with <b>him</b>, to <b>me</b> (with he ভুল)।","The book is <b>on</b> the table.|She arrived <b>at</b> noon.","নির্দিষ্ট ঘনিষ্ঠ সঙ্গী মুখস্থ রাখতে হয়: <b>afraid of, good at, interested in, depend on, married to, different from</b>।|সময়ে: <b>at</b> 5 pm, <b>on</b> Friday, <b>in</b> July।|Preposition-এর পর verb থাকলে -ing বসে: interested in <b>reading</b> (to read ভুল)।|Preposition বাক্যের শেষেও বসতে পারে: Who are you talking <b>to</b>?|<b>following, regarding, concerning</b> verb-ing রূপে থাকলেও preposition হতে পারে: following the wedding (বিয়ের পর)।"],
["Conjunction","সংযোজক অব্যয়","শব্দ, বাক্যাংশ বা বাক্যকে যুক্ত করে।","and, but, or, so হলো Coordinating; because, although, if, when হলো Subordinating conjunction।","I like tea <b>and</b> coffee.|He stayed home <b>because</b> it rained.","<b>Although / Though</b>-এর সঙ্গে but বসে না: Although he is poor, he is honest।|<b>Because</b>-এর সঙ্গে so বসে না।|জোড়া conjunction: <b>Either…or, Neither…nor, Not only…but also</b>—দুই পাশে একই ধরনের শব্দ বসাতে হয়।|<b>No sooner…than</b>, <b>Hardly…when</b>: এই জোড়া গুলিয়ে ফেলা হয়।|<b>in case</b> = সতর্কতার জন্য: Take my number <b>in case</b> you get lost।|<b>provided (that)</b> conjunction, শর্ত বোঝায়: I shall help you <b>provided</b> you obey me।"],
["Interjection","আবেগসূচক অব্যয়","হঠাৎ আনন্দ, দুঃখ, বিস্ময় ইত্যাদি অনুভূতি প্রকাশ করে।","বাক্যের বাকি অংশের সঙ্গে এর grammatical সম্পর্ক থাকে না। সাধারণত পরে (!) বসে।","<b>Wow</b>! What a view.|<b>Alas</b>! He failed.","<b>Well</b> কখনো interjection (Well! I didn’t expect that), কখনো adverb (He sings well)।|দুই বা ততোধিক শব্দেও হয়: <b>Good heavens!</b> <b>Thank goodness!</b>"],
["Tricky Cases","একই শব্দ, ভিন্ন রূপ","একই শব্দ বাক্যে কী কাজ করছে, তার ওপরই নির্ভর করে সেটি কোন Parts of Speech।","শব্দ দেখে নয়, বাক্যে তার কাজ দেখো: এটি কি নাম (noun)? কাজ (verb)? গুণ (adjective)? কীভাবে বা কতটা (adverb)?","The <b>light</b> is bright. (Noun)|This bag is <b>light</b>. (Adjective)|Please <b>light</b> the lamp. (Verb)|He runs <b>fast</b>. (Adverb)|He is a <b>fast</b> runner. (Adjective)","<b>after</b> হতে পারে preposition (after lunch), conjunction (after he left) বা adverb (soon after)।|<b>that</b> হতে পারে pronoun, conjunction বা adjective।|<b>home</b> (go home) ও <b>down</b> (The sun went down) বাক্যে adverb; <b>home</b> noun-ও হয়।"]
],
mcqs:[
{q:"“<u>Honesty</u> is the best policy.” এখানে underlined শব্দটি কী?",o:["Verb","Noun","Adjective","Adverb"],a:1,e:"Honesty একটি ভাবের নাম, তাই এটি Abstract Noun।"},
{q:"“She helped Rina.” এখানে কোনটি Subject Pronoun?",o:["helped","Rina","She","her"],a:2,e:"She বাক্যের subject এবং Rina-র বদলে ব্যবহৃত হয়েছে, তাই এটি Subject Pronoun।"},
{q:"“She <u>sings</u> beautifully.” Underlined শব্দটি কী?",o:["Noun","Adjective","Adverb","Verb"],a:3,e:"sings একটি কাজ বোঝাচ্ছে, তাই এটি Verb।"},
{q:"“She is a very <u>intelligent</u> girl.” Underlined শব্দটি কী?",o:["Adjective","Adverb","Noun","Verb"],a:0,e:"intelligent noun girl-এর গুণ বলছে, তাই এটি Adjective।"},
{q:"“He completed the work <u>very</u> carefully.” Underlined শব্দটি কী?",o:["Adjective","Verb","Adverb","Preposition"],a:2,e:"very অন্য একটি adverb (carefully)-কে modify করছে, তাই এটি Adverb।"},
{q:"“The book is <u>on</u> the table.” Underlined শব্দটি কী?",o:["Conjunction","Preposition","Adverb","Adjective"],a:1,e:"on noun table-এর আগে বসে বইয়ের অবস্থানের সম্পর্ক দেখাচ্ছে, তাই এটি Preposition।"},
{q:"“I wanted to go, <u>but</u> it was raining.” Underlined শব্দটি কী?",o:["Preposition","Interjection","Conjunction","Adverb"],a:2,e:"but দুটি বাক্যকে যুক্ত করেছে, তাই এটি Conjunction।"},
{q:"“<u>Hurrah</u>! We won the match.” Underlined শব্দটি কী?",o:["Interjection","Noun","Verb","Conjunction"],a:0,e:"Hurrah হঠাৎ আনন্দ প্রকাশ করছে, তাই এটি Interjection।"},
{q:"“This bag is very <u>light</u>.” এখানে light কী?",o:["Noun","Verb","Adverb","Adjective"],a:3,e:"light এখানে bag কেমন তা বলছে (হালকা), তাই Adjective। অন্য বাক্যে light noun (আলো) বা verb (জ্বালানো)-ও হতে পারে।"},
{q:"নিচের কোনটি Abstract Noun?",o:["Dhaka","Teacher","River","Kindness"],a:3,e:"Kindness গুণ বা ভাবের নাম, যা ছোঁয়া যায় না, তাই Abstract Noun।"},
{q:"নিচের কোনটি শুদ্ধ?",o:["He gave me many informations.","He gave me much information.","He gave me an information.","He gave me many information."],a:1,e:"Information uncountable noun; এর আগে a/an বা শেষে -s বসে না, much বসে।"},
{q:"She looks ____ in that dress.",o:["beautifully","beauty","beautiful","beautify"],a:2,e:"looks এখানে linking verb (দেখতে লাগা), তাই পরে adjective বসে, adverb নয়।"},
{q:"নিচের কোনটি শুদ্ধ?",o:["Although he is poor, but he is honest.","Although he is poor, he is honest.","Although he is poor but, he is honest.","Although he poor, he is honest."],a:1,e:"Although/Though-এর সঙ্গে but বসে না।"},
{q:"She is interested ____ music.",o:["on","at","in","with"],a:2,e:"interested in—এটি নির্দিষ্ট preposition, মুখস্থ রাখতে হয়।"},
{q:"He works very ____.",o:["hardly","hard","harder","hardness"],a:1,e:"hard এখানে adverb (কঠোরভাবে)। hardly মানে প্রায় না।"},
{q:"Everyone ____ present today.",o:["are","were","have","is"],a:3,e:"Everyone singular, তাই singular verb is বসে।"},
{s:"Noun",b:"44th BCS",q:"What is the plural form of ‘sheep’?",o:["sheeps", "sheep", "sheepes", "sheepses"],a:1,e:"Sheep-এর singular ও plural একই রূপ।"},
{s:"Noun",b:"38th BCS",q:"What is the plural form of ‘louse’?",o:["louses", "lice", "lices", "licess"],a:1,e:"louse-এর irregular plural হলো lice।"},
{s:"Noun",b:"39th BCS",q:"What is the plural number of “Ovum”?",o:["Ovumes", "Ovums", "Ova", "Ovams"],a:2,e:"Latin-জাত শব্দ: ovum → ova।"},
{s:"Noun",b:"40th BCS",q:"Identify the word that remains the same in the plural form:",o:["aircraft", "intention", "mouse", "thesis"],a:0,e:"aircraft-এর plural-ও aircraft। mouse → mice, thesis → theses।"},
{s:"Noun",b:"41st BCS",q:"Identify the word that can be used as both singular and plural.",o:["wood", "issue", "fish", "light"],a:2,e:"fish-এর singular ও plural একই রূপ।"},
{s:"Noun",b:"49th BCS",q:"Which gender is the noun ‘neighbour’?",o:["Masculine", "Feminine", "Neuter", "Common"],a:3,e:"neighbour পুরুষ বা নারী যে-কেউ হতে পারে, তাই Common Gender।"},
{s:"Noun",b:"43rd BCS",q:"What is the gender of the word ‘orphan’?",o:["neuter", "feminine", "common", "masculine"],a:2,e:"orphan ছেলে বা মেয়ে দুই-ই হতে পারে, তাই Common Gender।"},
{s:"Noun",b:"41st BCS",q:"Which one of the following is a common gender?",o:["king", "sovereign", "emperor", "queen"],a:1,e:"sovereign (শাসক) পুরুষ বা নারী উভয়ই হতে পারে।"},
{s:"Noun",b:"37th BCS",q:"Frailty thy name is woman. Here ‘Frailty’ is—",o:["A noun", "An adjective", "An adverb", "A verb"],a:0,e:"Frailty (দুর্বলতা) একটি ভাবের নাম, তাই Abstract Noun।"},
{s:"Pronoun",b:"33rd BCS",q:"Each of the sons followed ____ father’s trade.",o:["their", "her", "whose", "his"],a:3,e:"Each singular এবং sons পুরুষ, তাই singular possessive his।"},
{s:"Pronoun",b:"24th BCS",q:"Tell me ____ that.",o:["Whom told you", "that told you", "who told you", "told you"],a:2,e:"told-এর কর্তা দরকার, তাই subject form who।"},
{s:"Pronoun",b:"22nd BCS",q:"The children studied in a classroom ____ windows were never opened.",o:["that", "which", "where", "whose"],a:3,e:"classroom-এর windows, অর্থাৎ মালিকানা বোঝাতে whose।"},
{s:"Pronoun",b:"12th BCS",q:"Choose the correct sentence.",o:["Let he and you be witnesses", "Let you and him be witnesses", "Let you and he be witnesses", "Let you and he be witness"],a:1,e:"Let-এর পর object form (you, him) বসে এবং witnesses plural।"},
{s:"Adjective",b:"38th BCS",q:"I still have ____ money.",o:["a few", "quite a few", "many", "a little"],a:3,e:"money uncountable, তাই a little। a few, quite a few, many countable-এর সঙ্গে বসে।"},
{s:"Adjective",b:"35th BCS",q:"Which word is the determiner in “Will it take much time?”",o:["will", "take", "much", "time"],a:2,e:"much noun time-এর পরিমাণ বোঝাচ্ছে, তাই determiner।"},
{s:"Article",b:"45th BCS",q:"Identify the correct sentence:",o:["She speaks English like English", "She speaks the English like English", "She speaks the English like the English", "She speaks English like the English"],a:3,e:"ভাষা English-এর আগে the নয়, কিন্তু জাতি বোঝাতে the English।"},
{s:"Adverb",b:"49th BCS",q:"‘After lunch we went for a leisurely stroll’. Here ‘leisurely’ is a/an—",o:["adverb", "adjective", "noun", "conjunction"],a:1,e:"leisurely noun stroll-এর বিশেষণ, তাই Adjective।"},
{s:"Adverb",b:"23rd BCS",q:"I spent ____ with the patient.",o:["sometimes", "sometime", "some time", "some times"],a:2,e:"কিছু সময় ব্যয় করা বোঝাতে some time (দুই শব্দ)।"},
{s:"Adverb",b:"37th BCS",q:"The mother sat vigilantly beside the sick baby. Here ‘vigilantly’ is—",o:["a noun", "an adjective", "an adverb", "a verb"],a:2,e:"vigilantly verb sat-কে modify করছে, তাই Adverb।"},
{s:"Preposition",b:"39th BCS",q:"There was a small reception following the wedding. The word ‘following’ is—",o:["adjective", "adverb", "noun", "preposition"],a:3,e:"following এখানে noun wedding-এর আগে বসে সময়ের সম্পর্ক (পরে) দেখাচ্ছে।"},
{s:"Preposition",b:"41st BCS",q:"Call me if you have any problems regarding your work. Here ‘regarding’ is a/an—",o:["gerund", "apposition", "preposition", "conjunction"],a:2,e:"regarding = সম্পর্কে; noun-এর আগে বসে সম্পর্ক বোঝাচ্ছে।"},
{s:"Conjunction",b:"41st BCS",q:"‘I shall help you provided you obey me.’ The underlined word is—",o:["noun", "conjunction", "adjective", "adverb"],a:1,e:"provided দুটি clause যুক্ত করে শর্ত বোঝাচ্ছে।"},
{s:"Conjunction",b:"17th BCS",q:"Give her a telephone number to ring ____ she gets lost.",o:["Whether", "In case", "Unless", "Perhaps"],a:1,e:"সম্ভাব্য সমস্যার জন্য সতর্কতা বোঝাতে in case।"},
{s:"Tricky Cases",b:"41st BCS",q:"‘Come on, it’s time to go home.’ Here ‘home’ is a/an—",o:["noun", "verb", "adjective", "adverb"],a:3,e:"go home-এ home কাজটি কোথায় হবে তা বলছে, তাই Adverb।"},
{s:"Tricky Cases",b:"38th BCS",q:"The sun went down. The underlined word is used as a/an:",o:["preposition", "adverb", "noun", "conjunction"],a:1,e:"down এখানে noun ছাড়া একা বসে verb went-কে modify করছে।"},
{s:"Noun",b:"50th BCS",q:"What gender is the word ‘monarch’?",o:["masculine", "feminine", "neuter", "common"],a:3,e:"monarch (রাজা বা রানি) পুরুষ ও নারী দুই-ই হতে পারে, তাই Common Gender।"},
{s:"Article",b:"28th BCS",q:"Which sentence is correct?",o:["This is an unique case", "This is a unique case", "This is a very unique case", "This is the most unique case"],a:1,e:"unique-এর উচ্চারণ শুরু হয় ‘ইউ’ (consonant) ধ্বনিতে, তাই an নয়, a। unique-এর আগে very বা most বসে না।"},
{s:"Article",b:"37th BCS",q:"Use the appropriate article: I saw ____ one-eyed man when I was walking on the road.",o:["a", "an", "the", "no article is needed"],a:0,e:"one-eyed শুরু হয় ‘ওয়ান’ (w) ধ্বনিতে, যা consonant ধ্বনি, তাই a।"},
{s:"Article",b:"47th BCS",q:"Where there is ____ will, there is ____ way.",o:["the, a", "a, a", "a, the", "the, the"],a:1,e:"প্রবাদটি: Where there is a will, there is a way। দুই জায়গাতেই অনির্দিষ্ট a।"},
{s:"Preposition",b:"50th BCS",q:"‘You will need a variety of skills, including leadership, endurance etc.’ In this sentence the word ‘including’ is a—",o:["conjunction", "gerund", "participle", "preposition"],a:3,e:"including = সহ; noun leadership-এর আগে বসে সম্পর্ক বোঝাচ্ছে, তাই Preposition।"},
{s:"Tricky Cases",b:"50th BCS",q:"Identify the sentence where ‘up’ functions as a noun:",o:["He turned the volume up.", "Business confidence is on the up.", "We live just up the road.", "Our system should be up by afternoon."],a:1,e:"on the up-এ the-এর পর up noun (উত্থান)। বাকিগুলোতে up যথাক্রমে adverb, preposition ও adjective।"}
]},
{id:"tense",name:"Tense",
lessons:[
["Tense কী?","কালের ধারণা","Verb-এর যে রূপ কাজ হওয়ার সময় ও অবস্থা বোঝায়, তাকে Tense বলে।","মূল তিন প্রকার: Present, Past ও Future। প্রতিটির চারটি রূপ: Indefinite, Continuous, Perfect ও Perfect Continuous। মোট ১২টি Tense।","Present: He <b>plays</b> cricket.|Past: He <b>played</b> cricket.|Future: He <b>will play</b> cricket."],
["Present Tense","বর্তমান কাল","বর্তমানের অভ্যাস, চলমান কাজ বা সদ্য শেষ হওয়া কাজ বোঝায়।","Indefinite: Sub + V1 (s/es)<br>Continuous: Sub + am/is/are + V-ing<br>Perfect: Sub + has/have + V3<br>Perfect Continuous: Sub + has/have been + V-ing","He <b>plays</b> cricket every day. (অভ্যাস)|She <b>is reading</b> now. (চলমান)|I <b>have finished</b> the work. (সদ্য শেষ)|He <b>has been waiting</b> for two hours. (শুরু থেকে এখনো চলছে)"],
["Past Tense","অতীত কাল","অতীতে ঘটে যাওয়া কাজ বা অবস্থা বোঝায়।","Indefinite: Sub + V2<br>Continuous: Sub + was/were + V-ing<br>Perfect: Sub + had + V3<br>Perfect Continuous: Sub + had been + V-ing","She <b>went</b> to school yesterday.|They <b>were playing</b> when it began to rain.|The train <b>had left</b> before I reached.|He <b>had been studying</b> for two hours when I came."],
["Future Tense","ভবিষ্যৎ কাল","ভবিষ্যতে ঘটবে এমন কাজ বা অবস্থা বোঝায়।","Indefinite: Sub + will/shall + V1<br>Continuous: Sub + will be + V-ing<br>Perfect: Sub + will have + V3<br>Perfect Continuous: Sub + will have been + V-ing","I <b>will call</b> you tomorrow.|He <b>will be sleeping</b> at 10 pm.|She <b>will have finished</b> the work by 5 pm.|By June, I <b>will have been living</b> here for five years."],
["পরীক্ষায় আসা নিয়ম","গুরুত্বপূর্ণ টিপস","সময়ের শব্দ দেখে Tense ঠিক করা যায়।","<b>since</b> = নির্দিষ্ট সময়ের শুরু (since 2015); <b>for</b> = সময়ের পরিমাণ (for ten years)। <b>yesterday, ago, last</b> থাকলে Past Indefinite বসে, Present Perfect নয়। If/when/before/after-এর clause-এ ভবিষ্যৎ অর্থ হলেও Present Indefinite বসে।","I met him <b>yesterday</b>. (have met ভুল)|He has lived here <b>since</b> 2015.|If it <b>rains</b>, we will stay home.|I <b>know</b> him. (know, like, want সাধারণত Continuous হয় না)"]
],
mcqs:[
{q:"He ____ cricket every day.",o:["plays","is playing","played","has played"],a:0,e:"প্রতিদিনের অভ্যাস বোঝাতে Present Indefinite বসে। He-এর সঙ্গে verb-এ s যুক্ত হয়।"},
{q:"Look! The baby ____.",o:["sleeps","is sleeping","slept","has slept"],a:1,e:"Look! বলায় এখনই চলছে এমন কাজ বোঝাচ্ছে, তাই Present Continuous (is sleeping)।"},
{q:"I ____ him since 2015.",o:["know","am knowing","have known","knew"],a:2,e:"since থাকলে Present Perfect বসে। know একটি stative verb, তাই Continuous হয় না।"},
{q:"He has been waiting ____ two hours.",o:["since","for","from","at"],a:1,e:"two hours সময়ের পরিমাণ, তাই for বসে। নির্দিষ্ট শুরুর সময়ের আগে since বসে।"},
{q:"We ____ a movie when the power went out.",o:["watched","were watching","had watched","are watching"],a:1,e:"অতীতে একটি কাজ চলার মধ্যে অন্য কাজ ঘটলে Past Continuous (were watching) বসে।"},
{q:"The train ____ before I reached the station.",o:["left","was leaving","had left","has left"],a:2,e:"অতীতের দুটি কাজের আগেরটিতে Past Perfect (had left) বসে।"},
{q:"I ____ him yesterday.",o:["have met","met","had met","meet"],a:1,e:"yesterday থাকলে Past Indefinite বসে, Present Perfect বসে না।"},
{q:"I ____ you tomorrow.",o:["called","will call","have called","call"],a:1,e:"tomorrow ভবিষ্যৎ বোঝায়, তাই Future Indefinite (will call)।"},
{q:"By next June, she ____ her degree.",o:["will complete","will have completed","has completed","completes"],a:1,e:"By + ভবিষ্যৎ সময় থাকলে ওই সময়ের মধ্যে কাজ শেষ হবে বোঝায়, তাই Future Perfect।"},
{q:"If it ____ tomorrow, we will stay at home.",o:["will rain","rains","rained","would rain"],a:1,e:"If-clause-এ ভবিষ্যৎ অর্থ হলেও Present Indefinite (rains) বসে।"}
]},
{id:"articles",name:"Articles",
lessons:[
["A / An", "অনির্দিষ্ট আর্টিকেল", "যে-কোনো একটি, অর্থাৎ অনির্দিষ্ট singular countable noun-এর আগে a বা an বসে।", "বানান নয়, উচ্চারণের প্রথম ধ্বনি দেখো: consonant ধ্বনির আগে a, vowel ধ্বনির আগে an।", "<b>a</b> book, <b>a</b> doctor|<b>an</b> apple, <b>an</b> egg", "<b>an hour, an honest man</b>: h নীরব, তাই an।|<b>a university, a unique case, a European</b>: শুরু ‘ইউ’ ধ্বনিতে (consonant), তাই a।|<b>a one-eyed man</b>: শুরু ‘ওয়ান’ ধ্বনিতে, তাই a।|<b>an MBBS, an M.A.</b>: অক্ষরের উচ্চারণ ‘এম’ (vowel ধ্বনি), তাই an।|Uncountable ও plural noun-এর আগে a/an বসে না।"],
["The", "নির্দিষ্ট আর্টিকেল", "নির্দিষ্ট বা পরিচিত noun-এর আগে the বসে, যার কথা বক্তা ও শ্রোতা দুজনেই জানে বা আগে একবার উল্লেখ হয়েছে।", "একবার a দিয়ে পরিচয় করালে পরের বার সেই noun-এর আগে the বসে।", "I bought <b>a</b> pen. <b>The</b> pen is red.|<b>The</b> sun rises in the east.", "অনন্য বস্তু: <b>the sun, the moon, the earth</b>।|নদী, সাগর, পর্বতমালা: <b>the Meghna, the Himalayas</b>।|Superlative ও ordinal: <b>the best, the first</b>।|পবিত্র গ্রন্থ: <b>the Quran, the Bible</b>।|<b>the + জাতীয়তা</b> = সেই জাতির মানুষ: She speaks English like <b>the</b> English।|<b>the + adjective</b> = সেই শ্রেণির মানুষ: <b>the rich, the poor</b>।"],
["No Article", "আর্টিকেল বসে না", "কিছু ক্ষেত্রে noun-এর আগে কোনো article বসে না।", "সাধারণ অর্থে বলা noun, ভাষা, খেলা ও নামবাচক শব্দের আগে article লাগে না।", "<b>Bangladesh</b> is a beautiful country.|She speaks <b>English</b>.", "ভাষা, খেলা, মাস, দিন: English, cricket, July, Friday।|Abstract ও material noun সাধারণ অর্থে: <b>Honesty</b> is the best policy।|Meal-এর নাম: I had breakfast at eight।|Plural noun সাধারণ অর্থে: <b>Books</b> are our friends।|ব্যক্তি, দেশ ও শহরের নাম: Rahim, Japan, Dhaka।"],
["Tricky Article Cases", "ফাঁদের ক্ষেত্র", "article বদলালে অনেক সময় অর্থই বদলে যায়।", "a/an, the এবং কোনো article না থাকা: তিন ক্ষেত্রে অর্থের পার্থক্য আলাদা করে মনে রাখো।", "He is <b>a</b> doctor. (পেশা)|He is <b>the</b> doctor. (নির্দিষ্ট একজন)", "<b>a little</b> (অল্প আছে) বনাম <b>little</b> (প্রায় নেই)।|<b>a few</b> (কয়েকটি আছে) বনাম <b>few</b> (প্রায় নেই)।|‘প্রতি’ অর্থে a: twice <b>a</b> day।|<b>the same, the only, the whole</b>-এর আগে the বসে।|the + singular noun গোটা শ্রেণি বোঝায়: <b>The</b> cow is a useful animal।"]
],

{s:"A / An",q:"He is ____ MBBS doctor.",o:["a", "an", "the", "no article"],a:1,e:"MBBS-এর উচ্চারণ শুরু ‘এম’ (vowel ধ্বনি) দিয়ে, তাই an।"},

{s:"The",q:"“The rich are not always happy.” Here ‘the rich’ means—",o:["a rich man", "rich people", "richness", "a rich thing"],a:1,e:"the + adjective = সেই শ্রেণির মানুষ (plural)।"},

{s:"No Article",q:"____ honesty is the best policy.",o:["The", "An", "A", "No article"],a:3,e:"Abstract noun সাধারণ অর্থে বললে article বসে না।"},
{s:"No Article",q:"He plays ____ cricket every evening.",o:["a", "an", "the", "no article"],a:3,e:"খেলার নামের আগে article বসে না।"},
{s:"Tricky Article Cases",q:"‘Few friends came’ means—",o:["some friends came", "almost no friends came", "many friends came", "exactly one friend came"],a:1,e:"few (a ছাড়া) = প্রায় নেই; a few = কয়েকজন আছে।"},
{s:"Tricky Article Cases",q:"He takes medicine twice ____ day.",o:["an", "a", "the", "no article"],a:1,e:"‘প্রতি’ অর্থে a বসে: twice a day।"}

{id:"prep",name:"Prepositions",
lessons:[
["Time & Place", "সময় ও স্থানের Preposition", "at, on, in: সময় ও জায়গার ব্যাপ্তি অনুযায়ী ছোট থেকে বড়, তিনটি ভাগ।", "at = নির্দিষ্ট বিন্দু, on = দিন/তারিখ বা পৃষ্ঠ, in = বড় সময় বা ঘেরা জায়গা।", "The class starts <b>at</b> 9 o’clock.|I will meet you <b>on</b> Friday.|She was born <b>in</b> July.", "সময়: <b>at</b> noon/night, <b>on</b> Monday/5 May, <b>in</b> July/2020/the morning।|স্থান: <b>at</b> the bus stop, <b>on</b> the table, <b>in</b> Dhaka।|<b>since</b> + সময়বিন্দু (since 2015), <b>for</b> + সময়কাল (for two years)।"],
["Dependent Prepositions", "নির্দিষ্ট সঙ্গী", "কিছু verb ও adjective-এর সঙ্গে নির্দিষ্ট preposition-ই বসে, নিয়ম নেই, মুখস্থ করতে হয়।", "একই verb আলাদা preposition নিয়ে আলাদা অর্থ দেয়: look <b>at</b> (তাকানো), look <b>after</b> (দেখাশোনা), look <b>down on</b> (তুচ্ছ করা)।", "She is <b>interested in</b> music.|He is <b>afraid of</b> snakes.", "<b>afraid of, fond of, proud of, good at, interested in, married to, different from</b>।|<b>depend on, insist on, look down on, look forward to, take to task</b>।|<b>take someone to task</b> = তিরস্কার করা।"],
["Gerund & Pronoun", "Preposition-এর পর কী বসে", "Preposition-এর পর verb থাকলে -ing (gerund) বসে এবং সর্বনাম থাকলে object form বসে।", "to infinitive-এর to আর preposition to আলাদা: look forward <b>to seeing</b> (to = preposition)।", "He is fond of <b>reading</b> novels.|Her parents approved of <b>her going</b> abroad.", "<b>interested in reading</b> (to read নয়)।|<b>look forward to meeting, used to driving, object to going</b>: এখানে to preposition, তাই -ing।|Preposition-এর পর pronoun: with <b>him</b>, between you and <b>me</b>।"],
["Look-alikes", "একই রকম, ভিন্ন অর্থ", "দেখতে কাছাকাছি কিন্তু অর্থ আলাদা, এমন preposition জোড়া।", "দুইয়ের মধ্যে between, দুইয়ের বেশির মধ্যে among।", "The prize was shared <b>among</b> the three boys.|The match is <b>between</b> Bangladesh and India.", "<b>between</b> (দুজন/দুটি) বনাম <b>among</b> (দুইয়ের বেশি)।|<b>beside</b> (পাশে) বনাম <b>besides</b> (ছাড়াও)।|<b>in time</b> (সময় থাকতে) বনাম <b>on time</b> (ঠিক সময়ে)।|<b>different from</b> (different than/to নয়)।"],
["Preposition or Not?", "শব্দটি কোন Parts of Speech", "একই শব্দ বাক্যে preposition, adverb, conjunction বা adjective হতে পারে।", "noun বা pronoun-এর আগে বসে সম্পর্ক দেখালে সেটি preposition।", "A reception <b>following</b> the wedding.|Call me about problems <b>regarding</b> your work.", "<b>following, regarding, concerning, including</b> noun-এর আগে বসলে preposition।|<b>down</b> একা বসলে adverb: The sun went down। <b>down</b> noun-এর আগে বসলে preposition: down the road।|<b>above</b> noun-এর আগে বসলে adjective: the above address।|<b>before, after, since</b> clause যুক্ত করলে conjunction।"]
],

{id:"rfv",name:"Right Form of Verbs",
lessons:[
["SVA 1 · Basic Rule","মূল নিয়ম ও Subject চেনা",
"Subject singular হলে verb singular, plural হলে verb plural হয়। Present Indefinite-এ singular subject-এর verb-এ s/es যুক্ত হয় (He plays), plural subject-এর verb-এ হয় না (They play)।",
"<b>তিন ধাপের কৌশল:</b> (১) verb-এর আগে ‘কে/কী’ প্রশ্ন করে আসল Subject খুঁজে বের করো। (২) সেটি singular না plural ঠিক করো। (৩) সেই অনুযায়ী verb বসাও। মাঝের phrase বা verb-এর ঠিক আগের noun দেখে verb ঠিক কোরো না।<br>নিয়মগুলো ছয়টি কার্ডে সাজানো: মূল নিয়ম → সর্বদা singular → সর্বদা plural → যুক্ত subject → collective ও পরিমাণ → বিশেষ ক্ষেত্র।",
"The <b>boy</b> <b>plays</b> cricket. (singular + singular)|The <b>boys</b> <b>play</b> cricket. (plural + plural)|The <b>price</b> of vegetables <b>is</b> high. (Subject price; of-এর পরের vegetables নয়)|The <b>teacher</b> of these students <b>is</b> kind.|<b>be ও have:</b> I <b>am</b>, You/We/They <b>are</b>, He/She/It <b>is</b>; I/You/We/They <b>have</b>, He/She/It <b>has</b>।",
"<b>Subject ও verb-এর মাঝের phrase উপেক্ষা করো:</b> A box of mangoes <b>is</b> on the table (mangoes নয়, box)।|<b>You সবসময় are নেয়,</b> একজনকে বোঝালেও: You <b>are</b> my friend।|<b>I-এর সঙ্গে am বসে</b> (is/are নয়): I <b>am</b> ready।|<b>Past-এ:</b> was (I, he, she, it), were (you, we, they)।"],
["SVA 2 · Always Singular","সর্বদা Singular Verb",
"কিছু শব্দ বা গঠন দেখতে plural হলেও, বা পরে plural noun থাকলেও, verb সবসময় singular হয়।",
"<b>মনে রাখার ছক:</b> Each/Every/One/Either/Neither + of + plural; The number of; Many a; uncountable noun; এবং -s দিয়ে শেষ হওয়া কিছু বিষয়ের নাম।",
"<b>Each of / One of / Either of / Neither of + plural noun:</b> <b>Each of</b> the boys <b>has</b> a pen।|<b>Each / Every + singular noun:</b> <b>Every</b> student <b>has</b> a book।|<b>Everyone, everybody, someone, anyone, nobody:</b> Everybody <b>is</b> present।|<b>The number of + plural noun:</b> <b>The number of</b> students <b>is</b> increasing।|<b>Many a + singular noun:</b> <b>Many a</b> man <b>has</b> failed।|<b>Uncountable noun</b> (information, advice, furniture, luggage, news): The news <b>is</b> true।|<b>দেখতে plural, অর্থে singular</b> (mathematics, physics, economics, measles): Mathematics <b>is</b> a difficult subject।|<b>টাকা, সময়, দূরত্ব, ওজন এক একক ধরলে:</b> Ten kilometres <b>is</b> a long distance।|<b>Gerund বা infinitive subject:</b> Reading books <b>is</b> a good habit।",
"<b>The number of</b> (সংখ্যাটি, singular) বনাম <b>A number of</b> (অনেক, plural): The number is increasing; A number of students <b>are</b> absent।|<b>Many a</b> + singular noun হলে singular verb; কিন্তু <b>Many</b> + plural noun হলে plural verb: Many students <b>are</b> absent।|<b>Each of</b>-এর পরে pronoun বসলেও singular: Each of them <b>has</b> done his duty।|<b>None of</b> + plural noun সাধারণত অর্থ দেখে singular বা plural নেয়।"],
["SVA 3 · Always Plural","সর্বদা Plural Verb",
"কিছু শব্দ ও গঠন অর্থে একাধিক বোঝায়, তাই সবসময় plural verb নেয়।",
"<b>মনে রাখার ছক:</b> Both, Several, Few, Many, A few, A number of; the + adjective; police, cattle, people; জোড়া-অঙ্গের জিনিস।",
"<b>Both, several, few, many, a few + plural:</b> <b>Both</b> of them <b>are</b> my friends।|<b>A number of + plural noun:</b> <b>A number of</b> students <b>are</b> absent।|<b>the + adjective</b> (শ্রেণি বোঝালে): <b>The poor</b> <b>are</b> often neglected।|<b>Police, cattle, people, poultry:</b> The police <b>have</b> arrived. Cattle <b>are</b> grazing।|<b>জোড়া অঙ্গ বা যন্ত্র</b> (trousers, scissors, spectacles, pants, glasses): My trousers <b>are</b> too long।",
"<b>A pair of + এসব শব্দ</b> হলে verb singular হয়, কারণ pair-ই Subject: <b>A pair of</b> scissors <b>is</b> on the table।|<b>Few বনাম A few:</b> দুটোই plural verb নেয়, অর্থ আলাদা: Few <b>are</b> perfect (প্রায় কেউ নয়); A few <b>are</b> ready (কয়েকজন আছে)।|<b>police</b>-এর আগে the বসে এবং plural verb নেয়, কিন্তু <b>a policeman</b> singular: A policeman <b>is</b> standing there।"],
["SVA 4 · Joined Subjects","যুক্ত Subject: and, with, or, nor",
"দুই বা ততোধিক Subject যুক্ত থাকলে verb কার সঙ্গে মিলবে, তা সংযোজক শব্দের ওপর নির্ভর করে।",
"<b>তিন ভাগে মনে রাখো:</b> <b>and</b> → সাধারণত plural; <b>with-group</b> → প্রথম subject অনুযায়ী; <b>or/nor-group</b> → কাছের (পরের) subject অনুযায়ী।",
"<b>১. and (plural):</b> Rahim <b>and</b> Karim <b>are</b> close friends।|<b>২. with-group (প্রথম subject অনুযায়ী):</b> with, along with, together with, as well as, in addition to, accompanied by: The teacher, <b>along with</b> his students, <b>is</b> coming।|<b>২-এর আরেক উদাহরণ:</b> The Principal, <b>as well as</b> the teachers, <b>is</b> present।|<b>৩. or/nor-group (কাছের subject অনুযায়ী):</b> either…or, neither…nor, not only…but also, or, nor: <b>Neither</b> the teacher <b>nor</b> the students <b>were</b> present।|<b>৩-এর আরেক উদাহরণ:</b> Not only the boys <b>but also</b> the teacher <b>is</b> absent. Either you <b>or</b> I <b>am</b> wrong।",
"<b>and দিয়ে যুক্ত হলেও singular,</b> যদি দুটি নাম একটি জিনিস বা একই ব্যক্তি বোঝায়: Bread and butter <b>is</b> my breakfast।|<b>Each / Every + noun and noun:</b> Every boy and girl <b>is</b> present।|<b>দুই ব্যক্তি হলে দ্বিতীয় noun-এর আগে the বসে:</b> The teacher and the poet <b>are</b> here; একই ব্যক্তি হলে: The teacher and poet <b>is</b> here।|<b>কাছের subject-ই নির্ধারক:</b> Neither he nor they <b>are</b> ready; Neither they nor he <b>is</b> ready।"],
["SVA 5 · Collectives & Quantity","Collective Noun ও পরিমাণবাচক শব্দ",
"Collective noun (committee, team, class, family, jury) একটি দল বোঝায়। পুরো দলকে এক একক ধরলে verb singular, সদস্যদের আলাদা আলাদা ধরলে verb plural হয়।",
"<b>পরিমাণের নিয়ম:</b> Half, Some, All, Most, A lot of, শতাংশ বা Majority-র পর <b>of + noun</b> থাকলে verb ওই noun অনুযায়ী বসে: noun singular হলে singular, plural হলে plural।",
"<b>এক একক হিসেবে (singular):</b> The committee <b>has</b> taken a decision।|<b>সদস্যরা আলাদাভাবে (plural):</b> The jury <b>were</b> divided in their opinions।|<b>Half of + noun:</b> Half of the cake <b>is</b> eaten; Half of the apples <b>are</b> rotten।|<b>Percent / Some / All + of + noun:</b> Forty percent of the students <b>are</b> absent; Some of the water <b>is</b> spilt।|<b>A lot of / Plenty of + noun:</b> A lot of water <b>is</b> wasted; A lot of boys <b>are</b> present।|<b>দেশ বা বইয়ের নাম (দেখতে plural হলেও singular):</b> The United States <b>is</b> a big country. The Arabian Nights <b>is</b> an interesting book।",
"<b>সংকেত:</b> বাক্যে their, themselves বা আলাদা আলাদা কাজের উল্লেখ থাকলে collective noun plural; এক সিদ্ধান্ত বা এক কাজ থাকলে singular।|<b>The majority of + plural noun</b> = plural verb: The majority of the people <b>are</b> poor।|<b>Collective noun-এর plural রূপ</b> (committees, teams) সবসময় plural verb নেয়।|<b>Police, cattle, people</b> collective হলেও সবসময় plural (SVA 3 দেখো)।"],
["SVA 6 · Special Cases","There/Here, Relative Pronoun ও Inversion",
"কখনো Subject verb-এর পরে বসে, কখনো relative pronoun (who, which, that) Subject হয়। তখন আসল Subject খুঁজে বের করাই কাজ।",
"<b>মূল সূত্র:</b> There/Here-এর পরে আসল Subject থাকে, তাই সেটির সঙ্গে verb মেলাও। Relative pronoun Subject হলে verb তার <b>antecedent</b> (আগের noun বা pronoun) অনুযায়ী বসে।",
"<b>There / Here:</b> There <b>is</b> a pen on the table. There <b>are</b> two books on the table. Here <b>are</b> the keys।|<b>Relative pronoun (antecedent plural):</b> He is one of the boys who <b>are</b> late. (who = boys)|<b>The only one of … who (singular):</b> He is the only one of the boys who <b>is</b> present।|<b>I / you + who:</b> I, who <b>am</b> your friend, will help you।|<b>Inversion:</b> Seldom <b>does</b> he come late. Never <b>have</b> I seen such a sight।",
"<b>one of the + plural + who/that</b> → plural verb; <b>the only one of the + plural + who/that</b> → singular verb।|<b>Inverted বাক্যে</b> (Never, Seldom, Hardly) auxiliary-র পরে আসল Subject থাকে, সেটির সঙ্গে verb মেলাও।|<b>Subject ও verb-এর দূরত্ব বেশি হলে</b> আবার Subject খুঁজে মিলিয়ে নাও।"],
["Tense ও Verb Form", "Tense অনুযায়ী Verb-এর রূপ", "বাক্যের সময়ের সংকেত দেখে verb-এর সঠিক রূপ (V1, V2, V3) বেছে নিতে হয়।", "since, for, already, yet দেখলে Present Perfect; before/by the time + past দেখলে Past Perfect।", "I <b>have lived</b> here since 2015.|The train <b>had left</b> before I reached.", "<b>If + Present, will + V1</b> (সম্ভাব্য)।|<b>If + Past, would + V1</b>: If I <b>were</b> you, I would accept it।|<b>If + had + V3, would have + V3</b>: If he had worked hard, he <b>would have passed</b>।|<b>wish / as if / as though</b>-এর পর past: I wish I <b>were</b> a bird; He talks as if he <b>knew</b> everything।|Passive: <b>be + V3</b>।"],
["Gerund", "Verb + ing = Noun", "Verb-এর সঙ্গে -ing যোগ হয়ে যখন noun-এর কাজ করে, তখন তাকে Gerund বলে।", "চেনার কৌশল: -ing শব্দটি subject, object বা preposition-এর পরে noun-এর মতো বসে এবং ‘কাজটি’ দিয়ে প্রতিস্থাপন করা যায়।", "<b>Subject:</b> <b>Swimming</b> is a good exercise.|<b>Object:</b> He enjoys <b>swimming</b>.|<b>Preposition-এর object:</b> She is fond of <b>singing</b>.|<b>Complement:</b> His hobby is <b>reading</b>.|<b>Possessive-এর পর:</b> I don’t like <b>his coming</b> late.|<b>Gerund নেয় এমন verb:</b> enjoy, avoid, mind, finish, suggest, deny, admit, practise, postpone, consider, miss, risk।", "<b>Fixed গঠন:</b> It is no use / no good / worth + V-ing; cannot help; there is no point in; feel like; look forward to; object to; be used to।|<b>Preposition-এর পর সবসময় V-ing</b>, কখনো to V1 নয়: interested in <b>reading</b>।|<b>Gerund বনাম Participle:</b> a <b>swimming</b> pool = সাঁতারের জন্য pool (gerund); a <b>swimming</b> boy = যে boy সাঁতার কাটছে (participle)।"],
["Participle", "Verb + Adjective", "Verb থেকে তৈরি যে শব্দ adjective-এর কাজ করে এবং verb-এর ভাবও ধরে রাখে, তাকে Participle বলে।", "তিন প্রকার: Present Participle (V-ing), Past Participle (V3) ও Perfect Participle (having + V3)।", "<b>Present (V-ing):</b> চলমান বা সক্রিয় অর্থ: a <b>crying</b> baby, a <b>running</b> horse।|<b>Past (V3):</b> সম্পন্ন বা passive অর্থ: a <b>broken</b> window, a <b>boiled</b> egg, a <b>wounded</b> man।|<b>Perfect (having + V3):</b> আগে শেষ হওয়া কাজ: <b>Having finished</b> the work, he went home।|<b>Verb-এর অংশ হিসেবেও:</b> is <b>going</b>, has <b>gone</b>, was <b>broken</b>।|<b>Participle phrase:</b> <b>Walking</b> along the road, I saw a snake।", "<b>-ing বনাম -ed:</b> যা অনুভূতি জাগায় তা -ing, যে অনুভব করে সে -ed: The film is <b>boring</b>; I am <b>bored</b>। interesting/interested, exciting/excited, shocking/shocked।|<b>Dangling participle ভুল:</b> phrase-এর কর্তা ও main clause-এর কর্তা একই হতে হবে। Walking along the road, a snake bit me (ভুল); Walking along the road, <b>I saw</b> a snake (শুদ্ধ)।|<b>Having + V3</b> আগের কাজ বোঝায়, V-ing একই সময়ের কাজ বোঝায়।"],
["Infinitive", "to + V1", "Verb-এর মূল রূপ (V1), সাধারণত to-এর সঙ্গে, যা noun, adjective বা adverb-এর কাজ করে। কর্তা বা tense অনুযায়ী বদলায় না।", "দুই প্রকার: To-Infinitive (to + V1) এবং Bare Infinitive (to ছাড়া V1)।", "<b>Noun-এর কাজ:</b> <b>To err</b> is human. He wants <b>to go</b>.|<b>Adjective-এর কাজ:</b> I need water <b>to drink</b>.|<b>Adverb-এর কাজ (উদ্দেশ্য):</b> He came <b>to learn</b>.|<b>to V1 নেয়:</b> want, decide, hope, plan, refuse, promise, manage, agree, afford, learn, fail, offer, expect।|<b>Bare infinitive বসে:</b> modal (can, may, must, shall, will, should, would, could, might)-এর পর; had better ও would rather-এর পর; make, let, see, hear, watch, feel + object-এর পর (active-এ)।", "<b>too…to</b> ও <b>enough…to</b>: too weak <b>to walk</b>, strong enough <b>to lift</b>।|<b>Passive-এ to ফিরে আসে:</b> The teacher made him read → He was made <b>to read</b>।|<b>Infinitive-এর to</b> আর <b>preposition to</b> এক নয়: look forward <b>to seeing</b>, object <b>to going</b> (-ing বসে)।|<b>do/does/did-এর পর</b> সবসময় V1: He did not <b>go</b>।"],
["কোনটি কখন?", "Gerund · Participle · Infinitive", "তিনটিই verb থেকে তৈরি, কিন্তু কাজ আলাদা: Gerund = noun, Participle = adjective, Infinitive = noun/adjective/adverb।", "মনে রাখার সূত্র: Preposition-এর পর V-ing; Modal-এর পর V1; ইচ্ছা, সিদ্ধান্ত ও পরিকল্পনার verb-এর পর to V1।", "<b>Gerund:</b> Swimming is fun. (noun)|<b>Participle:</b> The swimming boy waved. (adjective)|<b>Infinitive:</b> He loves to swim. (noun)|<b>দুটোই চলে, অর্থ প্রায় একই:</b> like, love, hate, start, begin, continue, prefer।", "<b>stop + V-ing</b> = কাজ বন্ধ করা (He stopped smoking); <b>stop + to V1</b> = থেমে অন্য কাজ করা (He stopped to smoke)।|<b>remember + V-ing</b> = আগে করেছি মনে আছে (I remember meeting him); <b>remember + to V1</b> = করতে হবে, ভুলো না (Remember to lock the door)। forget-এও একই নিয়ম।|<b>try + V-ing</b> = পরীক্ষা করে দেখা; <b>try + to V1</b> = চেষ্টা করা।|<b>regret + V-ing</b> = অতীতের কাজের জন্য অনুতাপ; <b>regret + to V1</b> = দুঃখের সঙ্গে জানাচ্ছি।"],
["Special Structures", "বিশেষ গঠন", "কিছু গঠনে verb-এর রূপ নিয়ম করা থাকে, এগুলো গঠনসহ মুখস্থ রাখো।", "used to + V1 (অতীত অভ্যাস) আর be used to + V-ing (অভ্যস্ত) আলাদা।", "He <b>used to</b> play cricket.|He is <b>used to getting up</b> early.", "<b>would rather, had better</b> + V1: I would rather <b>stay</b> at home।|<b>cannot help, cannot but</b>: I couldn’t help <b>laughing</b>; I cannot but <b>laugh</b>।|<b>It is time / high time</b> + subject + past: It is high time we <b>went</b> home।|<b>prefer</b> V-ing to V-ing: He prefers walking to riding।"]
],

{s:"SVA 1 · Basic Rule",q:"A box of mangoes ____ on the table.",o:["are", "were", "have", "is"],a:3,e:"Subject box (singular); mangoes মাঝের phrase-এর অংশ।"},
{s:"SVA 2 · Always Singular",q:"Each of the boys ____ a pen.",o:["has", "have", "are", "were"],a:0,e:"Each of-এর পর plural noun থাকলেও verb singular।"},

{s:"SVA 3 · Always Plural",q:"A pair of scissors ____ on the table.",o:["are", "were", "is", "have"],a:2,e:"A pair of + noun হলে pair-ই Subject, তাই singular।"},

{s:"SVA 4 · Joined Subjects",q:"Not only the boys but also the teacher ____ absent.",o:["are", "were", "is", "have"],a:2,e:"Not only…but also-এ verb কাছের subject (teacher) অনুযায়ী।"},
{s:"SVA 4 · Joined Subjects",q:"Either you or I ____ wrong.",o:["is", "are", "am", "were"],a:2,e:"কাছের subject I, তাই am।"},
{s:"SVA 5 · Collectives & Quantity",q:"The jury ____ divided in their opinions.",o:["is", "was", "were", "has"],a:2,e:"সদস্যরা আলাদা মত দিয়েছে (their), তাই plural verb।"},
{s:"SVA 5 · Collectives & Quantity",q:"The United States ____ a big country.",o:["are", "have", "were", "is"],a:3,e:"দেশের নাম হিসেবে singular।"},

{s:"SVA 5 · Collectives & Quantity",q:"Forty percent of the students ____ absent.",o:["is", "was", "are", "has"],a:2,e:"of-এর পরের noun students plural।"},

{id:"cond",name:"Conditionals",
lessons:[
["Zero ও Type 1", "সত্য ও সম্ভাব্য শর্ত", "Zero: সাধারণ সত্য বা অভ্যাস। Type 1: ভবিষ্যতে ঘটতে পারে এমন বাস্তব শর্ত।", "Type 1-এর গঠন: <b>If + Present Simple, will/can/may + V1</b>।", "<b>Zero:</b> If you heat ice, it <b>melts</b>. (If + present, present)|<b>Type 1:</b> If it rains tomorrow, we <b>will stay</b> at home.|<b>Type 1:</b> If he comes early, he <b>can catch</b> the train.", "<b>If-clause-এ will বসে না:</b> If he will come ✗ → If he <b>comes</b> ✓।|<b>Unless = If not:</b> Unless you <b>work</b> hard, you will fail। unless-এর পরে আবার not বসে না (Unless you don’t work ✗)।"],
["Type 2", "অবাস্তব বা অসম্ভাব্য শর্ত (বর্তমান)", "বর্তমান বা ভবিষ্যতে যা ঘটার সম্ভাবনা কম বা অবাস্তব, তার কল্পনা।", "গঠন: <b>If + Past Simple, would/could/might + V1</b>।", "If I <b>had</b> wings, I <b>would fly</b>.|If he <b>worked</b> hard, he <b>would pass</b>.|If I <b>were</b> you, I <b>would accept</b> the offer.", "<b>If-এর পর সব subject-এর সঙ্গে were:</b> If I <b>were</b> you, If she <b>were</b> rich (formal ও পরীক্ষার শুদ্ধ রূপ)।|<b>If-clause-এ would বসে না:</b> If I would be you ✗।|If-clause past দেখালেও অর্থ বর্তমান বা ভবিষ্যৎ।"],
["Type 3", "অবাস্তব শর্ত (অতীত)", "অতীতে যা ঘটেনি, তার জন্য অনুতাপ বা কল্পনা।", "গঠন: <b>If + Past Perfect (had + V3), would/could/might have + V3</b>।", "If he <b>had studied</b> hard, he <b>would have passed</b>.|She <b>would have come</b> if she <b>had been</b> invited.", "<b>Inversion (If বাদ দিয়ে):</b> <b>Had he studied</b>, he would have passed।|<b>If-clause-এ would have বসে না:</b> If he would have studied ✗।|Type 3-এ অতীতের ঘটনা বদলানো যায় না, তাই ফলাফলও অতীত।"],
["Mixed ও Special", "মিশ্র ও বিশেষ গঠন", "মিশ্র conditional-এ শর্ত অতীতের, কিন্তু ফল বর্তমানের।", "Mixed: <b>If + had + V3, would + V1</b>: If I <b>had taken</b> the medicine, I <b>would be</b> well now।", "<b>Inversion:</b> <b>Were</b> I you, I would apologise। (Type 2)|<b>Inversion:</b> <b>Had</b> I known, I would have helped। (Type 3)|<b>Inversion:</b> <b>Should</b> you need help, call me। (Type 1)", "<b>Provided/Providing (that), as long as</b> = শুধু এই শর্তে: You can borrow it <b>provided</b> you return it।|<b>In case</b> = সতর্কতার জন্য: Take an umbrella <b>in case</b> it rains।|<b>But for + noun</b> = যদি না থাকত: <b>But for</b> your help, I would have failed।|<b>Unless</b> নিজেই negative, তাই পরে not লাগে না।"],
["Wish ও As if", "ইচ্ছা ও তুলনা", "wish, if only ও as if-এর পর অবাস্তব বা কল্পিত বিষয় বোঝাতে past form বসে।", "বর্তমানের অবাস্তব ইচ্ছায় <b>past (were)</b>, অতীতের অনুতাপে <b>had + V3</b>।", "I wish I <b>were</b> a bird. (বর্তমান)|I wish I <b>had studied</b> harder last year. (অতীত অনুতাপ)|She behaves as if she <b>were</b> the owner.|I would rather you <b>stayed</b> here.", "<b>If only</b> = wish-এর জোরালো রূপ: If only I <b>had been</b> more careful yesterday!|<b>as if / as though</b>: বর্তমান কল্পনায় past (He talks as if he knew everything), অতীত কল্পনায় had + V3।|<b>would rather + subject + past</b> (বর্তমান/ভবিষ্যৎ): I would rather you stayed।"]
],

{id:"sent",name:"Sentence",
lessons:[
["Sentence-এর গঠন", "Subject, Predicate ও Pattern", "সম্পূর্ণ ভাব প্রকাশ করে এমন শব্দগুচ্ছ হলো Sentence। এর দুই অংশ: Subject (কে/কী) ও Predicate (কী করছে বা কেমন)।", "শুরুতে capital letter থাকে এবং শেষে (.), (?) বা (!) বসে। প্রতিটি sentence-এ অন্তত একটি finite verb থাকে।", "<b>S + V:</b> Birds <b>fly</b>.|<b>S + V + O:</b> He <b>reads</b> a book.|<b>S + V + C:</b> He is <b>a doctor</b>.|<b>S + V + IO + DO:</b> She gave <b>me</b> <b>a book</b>.|<b>S + V + O + C:</b> They made him <b>captain</b>.", "<b>Imperative-এ subject (you) উহ্য থাকে:</b> (You) Close the door।|<b>Complement</b> subject বা object-এর গুণ বা পরিচয় বলে, আর <b>object</b> কাজের ফল গ্রহণ করে।|<b>Indirect object</b> আগে (কাকে), <b>direct object</b> পরে (কী)।"],
["অর্থ অনুযায়ী", "Assertive, Interrogative, Imperative, Optative, Exclamatory", "অর্থ বা ভাব অনুযায়ী Sentence পাঁচ প্রকার।", "মনে রাখো: বিবৃতি, প্রশ্ন, আদেশ, প্রার্থনা ও আবেগ।", "<b>Assertive:</b> He plays cricket. (Statement)|<b>Interrogative:</b> Do you like tea? (প্রশ্ন, শেষে ?)|<b>Imperative:</b> Close the door. (আদেশ, অনুরোধ, উপদেশ)|<b>Optative:</b> May Allah bless you. (ইচ্ছা, প্রার্থনা, অভিশাপ)|<b>Exclamatory:</b> What a beautiful flower it is! (আবেগ, শেষে !)", "<b>Optative:</b> May + subject + V1; Long live Bangladesh! (এটিও Optative)।|<b>Exclamatory গঠন:</b> What + a + adjective + noun + S + V! / How + adjective/adverb + S + V!।|<b>Let us go</b> (প্রথম পুরুষের আদেশ) Imperative; Let him come-ও Imperative।|<b>Rhetorical question</b> দেখতে প্রশ্ন, অর্থে বিবৃতি: Who does not love his country? = Everybody loves his country।"],
["গঠন অনুযায়ী", "Simple, Compound, Complex", "Clause-এর সংখ্যা ও সংযোগ অনুযায়ী Sentence তিন প্রকার।", "মূল সূত্র: Independent clause (নিজে পূর্ণ অর্থ দেয়) ও Dependent clause (একা অর্থ দেয় না)।", "<b>Simple:</b> একটি independent clause: Walking in the garden, she met a friend.|<b>Compound:</b> দুই বা বেশি independent clause, coordinating conjunction দিয়ে যুক্ত: He is poor, <b>but</b> he is honest.|<b>Complex:</b> একটি independent + এক বা একাধিক dependent clause: <b>Although he is poor</b>, he is honest.", "<b>Coordinating:</b> and, but, or, so, yet, for, nor। <b>Subordinating:</b> although, because, if, when, since, that, who, which।|<b>He came, he saw, he conquered</b> = Compound (তিনটি independent clause)।|<b>Compound-Complex:</b> দুই বা বেশি independent + অন্তত একটি dependent clause।|Participle বা infinitive phrase থাকলেও finite verb একটি হলে Simple।"],
["Phrase","শব্দগুচ্ছ",
"Phrase হলো একাধিক শব্দের এমন গুচ্ছ, যা একটি অর্থ প্রকাশ করে কিন্তু যাতে subject ও finite verb একসঙ্গে থাকে না। তাই এটি পূর্ণ বাক্য নয়, বাক্যের একটি অংশ মাত্র।",
"চেনার সূত্র: শব্দগুচ্ছে finite verb না থাকলেই সেটি Phrase। বাক্যে Phrase noun, adjective বা adverb-এর কাজ করে, আর সেই কাজ অনুযায়ী এর নাম হয়।",
"<b>Noun phrase</b> (noun-এর কাজ): <b>The old man with a stick</b> is my uncle.|<b>Adjective phrase</b> (noun-এর গুণ বলে): She is a girl <b>of great beauty</b>. (= beautiful)|<b>Adverb phrase</b> (কীভাবে, কখন, কোথায়): He spoke <b>in a loud voice</b>. (= loudly)|<b>Prepositional phrase</b> (preposition দিয়ে শুরু): The book is <b>on the table</b>.|<b>Infinitive phrase</b> (to + V1): He wants <b>to become a doctor</b>.|<b>Gerund phrase</b> (V-ing, noun-এর কাজ): <b>Reading novels</b> is my hobby.|<b>Participle phrase</b> (V-ing বা V3, adjective-এর কাজ): <b>Walking along the road</b>, I saw a snake.|<b>Absolute phrase</b> (নিজস্ব কর্তাসহ, বাকি বাক্য থেকে স্বাধীন): <b>The sun having set</b>, we returned home.",
"<b>Phrase বনাম Clause পরীক্ষা:</b> subject + finite verb থাকলে Clause, না থাকলে Phrase। after <b>the rain</b> = Phrase; after <b>the rain stopped</b> = Clause।|<b>Participle, gerund ও infinitive non-finite</b>, তাই এগুলো দিয়ে গঠিত শব্দগুচ্ছ Phrase, Clause নয়।|<b>Adjective phrase = একটি adjective:</b> a man <b>of honour</b> = an honourable man; <b>of no use</b> = useless।|<b>Adverb phrase = একটি adverb:</b> <b>in a hurry</b> = hurriedly; <b>with ease</b> = easily।|<b>Phrasal verb:</b> verb + preposition/adverb মিলে নতুন অর্থ: look after (দেখাশোনা করা), give up (ছেড়ে দেওয়া), put off (স্থগিত করা)।|<b>Idiomatic phrase</b> আক্ষরিক অর্থে নয়, বিশেষ অর্থ দেয়: a piece of cake (খুব সহজ কাজ), in the long run (শেষ পর্যন্ত)।|<b>Transformation-এ:</b> Simple বাক্যের phrase-ই Complex বাক্যে clause হয়: <b>In spite of his poverty</b> → <b>Although he is poor</b>।"],
["Clause","উপবাক্য",
"Clause হলো এমন শব্দগুচ্ছ, যাতে subject ও finite verb দুটোই আছে এবং যা কোনো বড় বাক্যের অংশ। একটি Clause নিজেই পূর্ণ বাক্যও হতে পারে (Simple sentence)।",
"Clause দুই প্রকার: <b>Principal (Independent) Clause</b> নিজে পূর্ণ অর্থ দেয়; <b>Subordinate (Dependent) Clause</b> একা পূর্ণ অর্থ দেয় না, Principal clause-এর ওপর নির্ভর করে। Subordinate clause আবার তিন প্রকার: Noun, Adjective ও Adverb clause।",
"<b>Principal clause:</b> <b>He said</b> that he was ill.|<b>Subordinate clause:</b> He said <b>that he was ill</b>.|<b>Noun clause</b> (noun-এর কাজ; কী? প্রশ্নের উত্তর): I know <b>that he is honest</b>. (object)|<b>Noun clause (subject):</b> <b>What he said</b> is true.|<b>Noun clause (complement):</b> The truth is <b>that he is guilty</b>.|<b>Adjective clause</b> (noun বা pronoun-কে বর্ণনা করে): The man <b>who lives next door</b> is a doctor.|<b>Adverb clause</b> (verb-কে বর্ণনা করে; কখন, কেন, কীভাবে): He went out <b>although it was raining</b>.|<b>Co-ordinate clauses</b> (দুটিই independent, and/but/or/so দিয়ে যুক্ত): He is poor, <b>but</b> he is honest.",
"<b>Noun clause শুরু হয়:</b> that, what, whether, if, who, how, why দিয়ে। চেনার উপায়: clause-টির জায়গায় ‘it’ বা ‘something’ বসালেও বাক্য টেকে (I know <b>it</b>)।|<b>Adjective clause শুরু হয় relative pronoun দিয়ে:</b> who, whom, whose, which, that (কখনো where, when, why)। এটি noun বা pronoun-এর ঠিক পরে বসে।|<b>Adverb clause শুরু হয় subordinating conjunction দিয়ে</b> এবং বাক্যের শুরুতেও বসতে পারে: Although it was raining, he went out।|<b>Adverb clause-এর প্রকার ও চিহ্ন:</b> Time (when, while, before, after, until, as soon as); Place (where, wherever); Cause (because, since, as); Purpose (so that, in order that, lest); Result (so…that, such…that); Condition (if, unless, provided); Concession (although, though, even if); Comparison (than, as…as); Manner (as, as if)।|<b>that-এর ফাঁদ:</b> I know <b>that</b> he is honest (conjunction, which বসানো যায় না, Noun clause); The book <b>that</b> I bought (= which বসানো যায়, relative pronoun, Adjective clause)।|<b>where-এর ফাঁদ:</b> I know <b>where he lives</b> (Noun clause, কী জানি?); This is the house <b>where he lives</b> (Adjective clause, house-কে বর্ণনা করছে)।|<b>If/When-clause-এ ভবিষ্যৎ অর্থেও present:</b> When he <b>comes</b>, I will tell him।|<b>Phrase ও Clause-এর পার্থক্য:</b> Clause-এ subject + finite verb থাকে, Phrase-এ থাকে না।"],
["Transformation", "Sentence-এর রূপান্তর", "অর্থ না বদলে Sentence-এর গঠন বা প্রকার বদলানোই Transformation।", "মূল কৌশল: phrase থেকে clause (Simple → Complex), আর clause থেকে conjunction দিয়ে আলাদা বাক্য (Complex → Compound)।", "<b>Simple → Complex:</b> In spite of his poverty, he is honest. → <b>Although he is poor</b>, he is honest.|<b>Simple → Complex:</b> Hearing the news, he wept. → <b>When he heard the news</b>, he wept.|<b>Complex → Compound:</b> As he was ill, he could not come. → He was ill, <b>so</b> he could not come.|<b>Assertive → Exclamatory:</b> It is a very beautiful flower. → <b>What a beautiful flower</b> it is!|<b>Too…to → So…that:</b> He is too weak to walk. → He is <b>so weak that he cannot walk</b>.", "<b>Rhetorical question → Assertive:</b> Who does not love his country? → Everybody loves his country।|<b>Although/Though ও but</b> একসঙ্গে বসে না: Compound-এ but/yet, Complex-এ although।|<b>Because/As = so</b> (কারণ ও ফল): Compound-এ ‘so’ ফলের আগে বসে।"]
],

]}
];
let T=TOPICS[0],Q=[],qi=0,sc=0,log=[];
function shuf(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function chips(){$("chips").innerHTML="";TOPICS.forEach(t=>{const b=document.createElement("button");b.className="chip"+(t===T?" on":"");b.textContent=t.name+(t.soon?" (শীঘ্রই)":"");b.disabled=!!t.soon;b.onclick=()=>{T=t;chips();tab(!$("lesson").hidden?"lesson":"quiz")};$("chips").appendChild(b)})}
function tab(t){$("tL").classList.toggle("on",t==="lesson");$("tQ").classList.toggle("on",t==="quiz");$("lesson").hidden=t!=="lesson";$("quiz").hidden=t!=="quiz";t==="lesson"?lesson():intro()}
function lesson(){$("lesson").innerHTML=T.lessons.map((l,i)=>`<details class="lc"${i?"":" open"}><summary>${l[0]}<small>${l[1]}</small></summary><div class="in"><p>${l[2]}</p><div class="note">${l[3]}</div><ul>${l[4].split("|").map(e=>"<li>"+e+"</li>").join("")}</ul>${l[5]?`<div class="tricky"><b>⚠ ট্রিকি পয়েন্ট</b><ul>${l[5].split("|").map(e=>"<li>"+e+"</li>").join("")}</ul></div>`:""}${bq(l[0])}</div></details>`).join("")}
function bq(n){const a=T.mcqs.filter(q=>q.s===n);return a.length?`<div class="tricky"><b>এই অংশের প্রশ্ন (${a.length})</b>${a.map(q=>`<details class="bq"><summary>${q.q} ${q.b?"<small>["+q.b+"]</small>":""}</summary><p>${q.o.map((o,i)=>"ABCD"[i]+". "+o).join("<br>")}</p><p><b>উত্তর: ${"ABCD"[q.a]}. ${q.o[q.a]}</b>। ${q.e}</p></details>`).join("")}</div>`:""}
function best(){try{return localStorage.getItem("acadex-grammar-best-"+T.id)}catch(e){return null}}
function intro(){const b=best();$("quiz").innerHTML=`<div class="box center"><h2>${T.name}: অনুশীলন পরীক্ষা</h2><p>${Math.min(10,T.mcqs.length)}টি MCQ, প্রতিবার ${T.mcqs.length}টির প্রশ্নভান্ডার থেকে এলোমেলোভাবে। প্রতিটি উত্তর দেওয়ার সঙ্গে সঙ্গেই সঠিক উত্তর ও ব্যাখ্যা দেখতে পাবে।</p>${b?`<p class="dim">তোমার সর্বোচ্চ স্কোর: ${b}/${Math.min(10,T.mcqs.length)}</p>`:""}<button class="btn" id="go">পরীক্ষা শুরু করো</button></div>`;$("go").onclick=start}
function start(){Q=shuf(T.mcqs).slice(0,10).map(q=>{const ix=shuf(q.o.map((_,i)=>i));return{...q,o:ix.map(i=>q.o[i]),a:ix.indexOf(q.a)}});qi=0;sc=0;log=[];ask()}
function ask(){const x=Q[qi];$("quiz").innerHTML=`<div class="box"><div class="bar"><span style="width:${qi/Q.length*100}%"></span></div><div class="meta"><span>প্রশ্ন ${qi+1}/${Q.length}</span><span>স্কোর ${sc}</span></div><p class="q">${x.q}</p><div id="opts"></div><div class="fb" id="fb" hidden></div><button class="btn" id="nx" hidden></button></div>`;
 x.o.forEach((o,i)=>{const b=document.createElement("button");b.className="opt";b.textContent="ABCD"[i]+". "+o;b.onclick=()=>pick(i);$("opts").appendChild(b)})}
function pick(i){const x=Q[qi],k=[...$("opts").children],ok=i===x.a;k.forEach(b=>b.disabled=true);k[x.a].classList.add("ok");if(!ok)k[i].classList.add("bad");if(ok)sc++;else log.push({q:x.q,y:x.o[i],c:x.o[x.a],e:x.e});
 const f=$("fb");f.hidden=false;f.innerHTML=(ok?"✅ সঠিক! ":"❌ ভুল। সঠিক উত্তর: <b>"+x.o[x.a]+"</b>। ")+x.e;const n=$("nx");n.hidden=false;n.textContent=qi===Q.length-1?"ফলাফল দেখো":"পরের প্রশ্ন";n.onclick=()=>{qi++;qi<Q.length?ask():done()}}
function done(){const n=Q.length,p=sc/n;try{if(sc>(+best()||0))localStorage.setItem("acadex-grammar-best-"+T.id,sc)}catch(e){}
 const m=p===1?"চমৎকার! সবগুলো সঠিক।":p>=.8?"খুব ভালো! আর একটু অনুশীলনেই পারফেক্ট।":p>=.5?"ভালো চেষ্টা। নিচের ভুলগুলো একবার দেখে নাও।":"পাঠ অংশটি আরেকবার পড়ে আবার চেষ্টা করো।";
 $("quiz").innerHTML=`<div class="box center"><div class="dim">তোমার স্কোর</div><div class="score">${sc}/${n}</div><p>${m}</p></div>`+
 (log.length?`<div class="box" style="margin-top:12px"><h2>ভুল উত্তরের রিভিউ (${log.length})</h2>${log.map(r=>`<div class="rv"><p>${r.q}</p><p class="y">তোমার উত্তর: ${r.y}</p><p class="c">সঠিক উত্তর: ${r.c}</p><p class="dim">${r.e}</p></div>`).join("")}</div>`:"")+
 `<button class="btn" id="again">আবার পরীক্ষা দাও</button><button class="btn alt" id="rl">পাঠ আবার পড়ো</button>`;
 $("again").onclick=start;$("rl").onclick=()=>tab("lesson")}
$("tL").onclick=()=>tab("lesson");$("tQ").onclick=()=>tab("quiz");
chips();lesson();
</script>
</body>
</html>
